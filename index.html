<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Caponioflix Premium</title>
    <link rel="icon" type="image/png" href="Nuovo progetto (1).png">
    <style>
        :root {
            --bg-color: #141414;
            --card-bg: #1f1f1f;
            --accent: #e50914; /* Rosso stile Netflix */
            --text-color: #ffffff;
            --text-muted: #aaaaaa;
            --border-color: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            position: relative;
        }

        /* SFONDO DINAMICO (GESTITO VIA IMG HTML PER MAX COMPATIBILITÀ CHROME) */
        #backdropContainer {
            position: fixed;
            inset: 0;
            z-index: -3;
            overflow: hidden;
            pointer-events: none;
            background: transparent;
        }

        #backdropImg {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: blur(16px) brightness(0.45) saturate(0.9);
            transform: scale(1.12); /* Evita bordi sfocati bianchi ai lati */
            transition: opacity 0.45s ease-in-out;
            opacity: 0;
        }

        /* SFUMATURA SCURA IN SOVRAPPOSIZIONE PER LA LEGGIBILITÀ */
        .backdrop-overlay {
            position: fixed;
            inset: 0;
            background: linear-gradient(180deg, rgba(255,255,255,0.04) 0%, rgba(0,0,0,0.14) 100%);
            z-index: -2;
            pointer-events: none;
        }

        .main-layout {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: relative;
            z-index: 1;
        }

        .page-shell {
            display: grid;
            grid-template-columns: 280px minmax(0, 1fr);
            gap: 20px;
            align-items: start;
        }

        .content-stack {
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-width: 0;
        }

        .sidebar {
            background: rgba(20, 20, 20, 0.72);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            padding: 16px;
            position: sticky;
            top: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .sidebar-title {
            font-size: 0.95rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
        }

        .sidebar-close,
        .sidebar-toggle {
            display: none;
            border: 1px solid rgba(255, 255, 255, 0.16);
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }

        .sidebar-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .sidebar-section-title {
            font-size: 0.86rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .sidebar-overlay {
            display: none;
        }

        /* HEADER / NAVBAR */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            width: 100%;
        }

        .logo-wrapper {
            display: flex;
            align-items: center;
        }

        .logo-link {
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .app-logo {
            max-height: 40px;
            width: auto;
            max-width: 160px;
            object-fit: contain;
        }

        .logo-fallback {
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--accent);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* CONTROLLI DI RICERCA */
        .controls-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .sidebar-toggle {
            display: none;
        }

        .type-selector {
            display: inline-flex;
            width: fit-content;
            max-width: 100%;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 999px;
            padding: 3px;
            border: 1px solid var(--border-color);
        }

        .type-btn {
            padding: 8px 14px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            border-radius: 999px;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .type-btn.active {
            background: var(--accent);
            color: #fff;
        }

        .search-box {
            display: flex;
            gap: 8px;
            flex-grow: 1;
        }

        .search-box input[type="text"] {
            border-radius: 999px;
        }

        input[type="text"], input[type="number"] {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            padding: 10px 12px;
            font-size: 0.95rem;
            outline: none;
            width: 100%;
        }

        input[type="text"] { 
            flex-grow: 1; 
            min-width: 0;
        }

        .btn-action {
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 999px;
            padding: 10px 18px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
        }
        

        /* SEZIONE HERO */
        .hero-section {
            display: grid;
            grid-template-columns: minmax(0, 1.2fr) minmax(280px, 0.8fr);
            gap: 24px;
            background: rgba(20, 20, 20, 0.65);
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            width: 100%;
            align-items: start;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        @media (max-width: 900px) {
            .hero-section {
                grid-template-columns: 1fr;
            }
        }

        .hero-poster {
            width: 180px;
            height: 270px;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.8);
            flex-shrink: 0;
        }

        .hero-details {
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-width: 0;
        }

        .hero-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            margin-top: 5px;
        }

        .btn-trailer {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.04);
            border-radius: 999px;
        }

        .btn-favorite {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 999px;
            width: 46px;
            height: 46px;
            font-size: 1.15rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        .btn-favorite.active {
            background: #fff;
            color: var(--accent);
            border-color: #fff;
        }

        .btn-favorites-view {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 999px;
            padding: 10px 16px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }

        .favorites-section {
            display: none;
            flex-direction: column;
            gap: 10px;
            padding: 4px 0;
        }

        .favorites-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
            align-items: start;
        }

        .favorite-card .card-img {
            height: 175px;
        }

        .favorite-card .card-info {
            min-height: 44px;
        }

        .favorite-card {
            position: relative;
            min-height: 100%;
        }

        .favorite-remove {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: none;
            background: rgba(0, 0, 0, 0.72);
            color: #fff;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            z-index: 2;
        }

        .favorites-empty {
            color: var(--text-muted);
            border: 1px dashed rgba(255, 255, 255, 0.18);
            border-radius: 12px;
            padding: 24px;
            text-align: center;
        }

        .btn-trailer:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .hero-title {
            font-size: 1.6rem;
            font-weight: 700;
            word-wrap: break-word;
        }

        .hero-meta {
            display: flex;
            gap: 12px;
            align-items: center;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .hero-overview {
            font-size: 0.95rem;
            color: #ccc;
            line-height: 1.6;
            max-height: 180px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 6;
            -webkit-box-orient: vertical;
        }

        .episodes-selector {
            display: none;
            gap: 10px;
            align-items: center;
            margin-top: 5px;
            flex-wrap: wrap;
        }

        .episodes-selector.active {
            display: flex;
        }

        .episodes-selector select {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            padding: 8px 10px;
            font-size: 0.9rem;
            outline: none;
            min-width: 90px;
        }

        /* RISULTATI / POPOLARI */
        .section-title {
            font-size: 1.1rem;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .section-block {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
            padding: 4px;
            width: 100%;
            align-items: start;
        }

        .rec-card {
            transform: none;
        }

        .card-item {
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .card-img {
            width: 100%;
            height: 175px;
            aspect-ratio: auto;
            object-fit: cover;
            display: block;
        }

        .card-info {
            padding: 8px;
        }

        .card-title {
            font-size: 0.8rem;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        button:focus, 
        input:focus, 
        .card-item:focus {
            outline: none !important;
            border-color: #ffffff !important;
            transform: scale(1.05);
            z-index: 10;
            box-shadow: 0 8px 20px rgba(229, 9, 20, 0.5);
        }

        .card-item.selected {
            border-color: var(--accent);
        }

        .btn-play-large {
            background: var(--accent);
            color: #fff;
            padding: 0;
            width: 46px;
            height: 46px;
            font-size: 1.05rem;
            font-weight: bold;
            border: none;
            border-radius: 999px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0;
            margin-top: 5px;
            box-shadow: 0 6px 18px rgba(229, 9, 20, 0.28);
        }

        .load-more-container {
            display: flex;
            justify-content: center;
            margin-top: 15px;
        }

        .btn-load-more {
            background: #2b2b2b;
            color: #fff;
            border: 1px solid var(--border-color);
            padding: 10px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn-load-more:hover {
            background: #3a3a3a;
        }

        .status-msg {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--text-muted);
            padding: 30px;
            font-size: 0.95rem;
        }

        .genre-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            width: 100%;
        }

        .genre-tag {
            padding: 6px 14px;
            background: rgba(0, 0, 0, 0.55);
            border: 1px solid var(--border-color);
            border-radius: 999px;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, color 0.2s, border-color 0.2s;
        }

        .genre-tag:hover {
            color: var(--text-color);
            border-color: rgba(255, 255, 255, 0.35);
        }

        .genre-tag.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        .genre-tag:focus {
            outline: none;
            border-color: #fff;
            box-shadow: 0 0 0 2px rgba(229, 9, 20, 0.45);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes heroFade {
            from { opacity: 0.55; }
            to { opacity: 1; }
        }

        @keyframes layoutFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes modalBackdropIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes modalContentIn {
            from {
                opacity: 0;
                transform: scale(0.96);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .main-layout {
            animation: layoutFadeIn 0.45s ease-out;
        }

        .hero-section.hero-animate .hero-poster,
        .hero-section.hero-animate .hero-details {
            animation: heroFade 0.35s ease-out;
        }

        .hero-poster {
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .card-item {
            animation: fadeInUp 0.4s ease-out both;
        }

        .card-item:hover:not(:focus) {
            transform: translateY(-3px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.45);
        }

        .btn-action,
        .btn-play-large {
            transition: transform 0.15s ease, background 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-action:active,
        .btn-play-large:active {
            transform: scale(0.97);
        }

        .btn-play-large:hover {
            box-shadow: 0 4px 18px rgba(229, 9, 20, 0.45);
        }

        .trailer-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }

        .trailer-modal.is-open {
            display: flex;
            animation: modalBackdropIn 0.25s ease-out;
        }

        .trailer-modal.is-open .trailer-modal-frame {
            animation: modalContentIn 0.3s ease-out;
        }

        .trailer-modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #fff;
            padding: 8px 14px;
            border-radius: 999px;
            font-weight: bold;
        }

        .overview-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.84);
            z-index: 10000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .overview-modal.is-open {
            display: flex;
            animation: modalBackdropIn 0.25s ease-out;
        }

        .overview-modal-card {
            background: rgba(20, 20, 20, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 12px;
            max-width: 760px;
            width: 100%;
            padding: 24px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
            position: relative;
            animation: modalContentIn 0.3s ease-out;
        }

        .overview-modal-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .overview-modal-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 12px;
        }

        .overview-modal-text {
            color: #ddd;
            line-height: 1.7;
            font-size: 0.95rem;
            max-height: 60vh;
            overflow-y: auto;
            margin-bottom: 16px;
        }

        .overview-modal-cast {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-top: 8px;
        }

        .overview-modal-actor {
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: flex-start;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 10px;
            padding: 8px;
        }

        .overview-modal-actor img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 8px;
            display: block;
        }

        .overview-modal-actor-name {
            font-weight: 700;
            font-size: 0.92rem;
        }

        .overview-modal-actor-role {
            font-size: 0.82rem;
            color: var(--text-muted);
        }

        .rec-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.84);
            z-index: 10001;
            justify-content: center;
            align-items: center;
            padding: 20px;
            cursor: pointer;
        }

        .rec-modal.is-open {
            display: flex;
            animation: modalBackdropIn 0.25s ease-out;
        }

        .rec-modal-card {
            background: rgba(20, 20, 20, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 12px;
            max-width: 720px;
            width: 100%;
            padding: 24px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
            position: relative;
            animation: modalContentIn 0.3s ease-out;
            cursor: default;
        }

        .rec-modal-body {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        .rec-modal-meta,
        .rec-modal-overview {
            color: #ddd;
            line-height: 1.7;
            font-size: 0.95rem;
            white-space: pre-wrap;
        }

        .rec-modal-overview {
            max-height: min(42vh, 280px);
            overflow-y: auto;
            padding-right: 6px;
        }

        .rec-modal-poster {
            width: 180px;
            height: 270px;
            object-fit: cover;
            border-radius: 8px;
            flex-shrink: 0;
        }

        .rec-modal-content {
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-width: 0;
        }

        .rec-modal-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 8px;
            align-items: center;
        }

        .rec-modal-actions .btn-favorite {
            width: 46px;
            height: 46px;
            padding: 0;
            flex-shrink: 0;
        }

        @media (prefers-reduced-motion: reduce) {
            .main-layout,
            .card-item,
            .hero-section.hero-animate .hero-poster,
            .hero-section.hero-animate .hero-details,
            .trailer-modal.is-open,
            .trailer-modal.is-open .trailer-modal-frame {
                animation: none;
            }

            .card-item:hover:not(:focus) {
                transform: none;
            }
        }
        @media (max-width: 900px) {
            .page-shell {
                grid-template-columns: 1fr;
            }

            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                height: 100vh;
                width: min(82vw, 320px);
                border-radius: 0 16px 16px 0;
                z-index: 1002;
                transform: translateX(-102%);
                transition: transform 0.25s ease;
            }

            .sidebar.is-open {
                transform: translateX(0);
            }

            .sidebar-overlay {
                display: block;
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.62);
                z-index: 1001;
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.25s ease;
            }

            .sidebar-overlay.is-open {
                opacity: 1;
                pointer-events: auto;
            }

            .sidebar-close {
                display: inline-flex;
            }

            .sidebar-toggle {
                display: inline-flex;
            }
        }

        @media (max-width: 600px) {
            .main-layout {
                padding: 12px;
                gap: 15px;
            }

            header {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }

            .logo-wrapper {
                justify-content: center;
            }

            .controls-bar {
                flex-direction: column;
                width: 100%;
            }

            .type-selector {
                width: 100%;
            }

            .type-btn {
                flex: 1;
                text-align: center;
            }

            .search-box {
                width: 100%;
            }

            .hero-section {
                flex-direction: column;
                text-align: center;
                padding: 16px;
            }

            .hero-poster {
                width: 110px;
                height: 165px;
            }

            .hero-details {
                align-items: center;
                width: 100%;
            }

            .hero-title {
                font-size: 1.3rem;
            }

            .hero-actions {
                width: 100%;

<script>
    const API_KEY = "19a3e7d1a5356e8daa2323dabc5e1a2d";
    let currentType = 'movie';
    let risultatiRicerca = [];
    let elementoSelezionato = null;
    let currentPage = 1;
    let isSearchMode = false;
    let selectedGenreId = null;
    const SEARCH_DEBOUNCE_MS = 500;
    const FAVORITES_STORAGE_KEY = 'caponioflix_favorites';
    let debounceTimer;
    let favorites = [];
    let currentView = 'home';

    const GENRES_BY_TYPE = {
        movie: [
            { id: null, label: 'Tutti' },
            { id: 28, label: 'Azione' },
            { id: 12, label: 'Avventura' },

            { id: 27, label: 'Horror' },
            { id: 10402, label: 'Musica' },
            { id: 10749, label: 'Romantico' },
            { id: 878, label: 'Fantascienza' },
            { id: 53, label: 'Thriller' },
            { id: 10752, label: 'Guerra' },
            { id: 37, label: 'Western' }
        ],
        tv: [
            { id: null, label: 'Tutti' },
            { id: 10759, label: 'Azione' },

            { id: 35, label: 'Commedia' },

            { id: 99, label: 'Documentario' },
            { id: 18, label: 'Dramma' },
            { id: 10751, label: 'Famiglia' },
            { id: 10765, label: 'Fantascienza' },
            { id: 10762, label: 'Kids' },
            { id: 9648, label: 'Mystery' },
            { id: 10763, label: 'News' },
            { id: 10764, label: 'Reality' },
            { id: 10766, label: 'Talk' },
            { id: 10767, label: 'War & Politics' },
            { id: 10768, label: 'Guerra' },
            { id: 37, label: 'Western' }
        ]
    };

    function getGenreLabel(id) {
        if (id == null) return '';
        const list = GENRES_BY_TYPE[currentType] || [];
        return list.find(g => g.id === id)?.label || 'Genere';
    }

    function loadFavorites() {
        try {
            const saved = localStorage.getItem(FAVORITES_STORAGE_KEY);
            favorites = saved ? JSON.parse(saved) : [];
        } catch {
            favorites = [];
        }
    }

    function saveFavorites() {
        try {
            localStorage.setItem(FAVORITES_STORAGE_KEY, JSON.stringify(favorites));
        } catch {
            console.warn('Impossibile salvare i preferiti su localStorage.');
        }
    }

    function getFavoriteKey(item) {
        return `${item?.type || currentType}:${item?.id}`;
    }

    function isFavorite(item) {
        if (!item) return false;
        const key = getFavoriteKey(item);
        return favorites.some(entry => getFavoriteKey(entry) === key);
    }

    function updateFavoriteButton(item) {
        const btn = document.getElementById('btnFavorite');
        if (!btn) return;
        const active = isFavorite(item);
        btn.classList.toggle('active', active);
        btn.textContent = active ? '♥' : '♡';
        btn.setAttribute('aria-pressed', String(active));
        btn.setAttribute('aria-label', active ? 'Rimuovi dai preferiti' : 'Aggiungi ai preferiti');
    }

    function toggleFavorite(item) {
        if (!item) return;
        const key = getFavoriteKey(item);
        const exists = favorites.some(entry => getFavoriteKey(entry) === key);

        if (exists) {
            favorites = favorites.filter(entry => getFavoriteKey(entry) !== key);
        } else {
            favorites.push({
                id: item.id,
                type: item.type || currentType,
                title: item.title || item.name || '',
                name: item.name || item.title || '',
                poster_path: item.poster_path || '',
                overview: item.overview || '',
                release_date: item.release_date || '',
                first_air_date: item.first_air_date || '',
                vote_average: item.vote_average || null,
                backdrop_path: item.backdrop_path || ''
            });
        }

        saveFavorites();
        updateFavoriteButton(item);
        renderFavoritesSection();
    }

    function renderFavoritesSection() {
        const container = document.getElementById('favoritesGrid');
        if (!container) return;

        if (!favorites.length) {
            container.innerHTML = '<div class="favorites-empty">Nessun titolo preferito. Aggiungi un cuore per salvarne uno.</div>';
            return;
        }

        container.innerHTML = '';
        favorites.forEach((item) => {
            const card = document.createElement('div');
            card.className = 'card-item favorite-card';
            card.tabIndex = 0;

            const removeBtn = document.createElement('button');
            removeBtn.type = 'button';
            removeBtn.className = 'favorite-remove';
            removeBtn.textContent = '✕';
            removeBtn.onclick = (event) => {
                event.stopPropagation();
                favorites = favorites.filter(entry => getFavoriteKey(entry) !== getFavoriteKey(item));
                saveFavorites();
                renderFavoritesSection();
                updateFavoriteButton(elementoSelezionato);
            };

            const posterPath = item.poster_path
                ? `https://image.tmdb.org/t/p/w342${item.poster_path}`
                : 'https://via.placeholder.com/185x278?text=No+Cover';

            const img = document.createElement('img');
            img.className = 'card-img';
            img.src = posterPath;
            img.alt = item.title || item.name || 'Preferito';
            img.style.aspectRatio = '2 / 3';

            const info = document.createElement('div');
            info.className = 'card-info';
            const titleEl = document.createElement('div');
            titleEl.className = 'card-title';
            titleEl.textContent = item.title || item.name || '';

            info.appendChild(titleEl);
            card.appendChild(removeBtn);
            card.appendChild(img);
            card.appendChild(info);
            card.onclick = () => {
                const favoriteType = item.type || 'movie';
                if (favoriteType !== currentType) {
                    currentType = favoriteType;
                    document.getElementById('btnMovie').classList.toggle('active', currentType === 'movie');
                    document.getElementById('btnTv').classList.toggle('active', currentType === 'tv');
                    const frame = document.getElementById('episodesFrame');
                    frame.classList.toggle('active', currentType === 'tv');
                    renderGenreTags();
                }
                aggiornaHeroDaItem(item);
            };
            container.appendChild(card);
        });
    }

    function toggleFavoritesView() {
        currentView = currentView === 'home' ? 'favorites' : 'home';
        const viewBtn = document.getElementById('favoritesViewToggle');
        const favoritesSection = document.getElementById('favoritesSection');
        const popularSection = document.getElementById('popularSection');

        if (viewBtn) {
            viewBtn.textContent = currentView === 'favorites' ? 'Home' : 'Preferiti';
        }

        if (favoritesSection) {
            favoritesSection.style.display = currentView === 'favorites' ? 'flex' : 'none';
        }

        if (popularSection) {
            popularSection.style.display = currentView === 'favorites' ? 'none' : 'flex';
        }

        if (currentView === 'favorites') {
            renderFavoritesSection();
        }
    }

    function renderGenreTags() {
        const bar = document.getElementById('genreBar');
        bar.innerHTML = '';
        (GENRES_BY_TYPE[currentType] || []).forEach(genre => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'genre-tag' + (selectedGenreId === genre.id ? ' active' : '');
            btn.textContent = genre.label;
            btn.tabIndex = 0;
            btn.onclick = () => setGenreFilter(genre.id);
            bar.appendChild(btn);
        });
    }

    function setGenreFilter(genreId) {
        selectedGenreId = genreId;
        renderGenreTags();
        if (window.innerWidth <= 900) {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            sidebar?.classList.remove('is-open');
            overlay?.classList.remove('is-open');
        }
        ricaricaLista(true);
    }

    function aggiornaTitoloGriglia() {
        const query = document.getElementById('searchInput').value.trim();
        const tipo = currentType === 'movie' ? 'Film' : 'Serie TV';
        if (query) {
            const genere = selectedGenreId ? ` · ${getGenreLabel(selectedGenreId)}` : '';
            document.getElementById('gridTitle').innerText = `Risultati per "${query}"${genere}`;
            return;
        }
        if (selectedGenreId) {
            document.getElementById('gridTitle').innerText = `${getGenreLabel(selectedGenreId)} · ${tipo}`;
            return;
        }
        document.getElementById('gridTitle').innerText = `Popolari del momento (${tipo})`;
    }

    function ricaricaLista(reset = true) {
        const query = document.getElementById('searchInput').value.trim();
        if (query) {
            cerca(reset);
        } else if (selectedGenreId) {
            caricaPerGenere(reset);
        } else {
            caricaPopolari(reset);
        }
    }

    function onInputSearch() {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => {
            cerca(true);
        }, SEARCH_DEBOUNCE_MS);
    }

    function cercaImmediata() {
        clearTimeout(debounceTimer);
        cerca(true);
    }
async function fetchRecommendations(id, mediaType = currentType) {
    const grid = document.getElementById('recsGrid');
    const titleEl = document.getElementById('recsTitle');
    try {
        const res = await fetch(`https://api.themoviedb.org/3/${mediaType}/${id}/recommendations?api_key=${API_KEY}&language=it-IT`);
        if (!res.ok) {
            titleEl.style.display = 'none';
            grid.innerHTML = '';
            return;
        }
        const data = await res.json();
        const results = (data.results || []).slice(0, 8);
        if (results.length === 0) {
            titleEl.style.display = 'none';
            grid.innerHTML = '';
            return;
        }
        titleEl.style.display = 'block';
        grid.innerHTML = '';
        results.forEach(item => {
            const posterPath = item.poster_path
                ? `https://image.tmdb.org/t/p/w200${item.poster_path}`
                : 'https://via.placeholder.com/185x278?text=No+Cover';
            const card = document.createElement('div');
            card.className = 'card-item rec-card';
            card.tabIndex = 0;
            const img = document.createElement('img');
            img.src = posterPath;
            img.alt = mediaType === 'movie' ? (item.title || '') : (item.name || '');
            img.style.width = '100%';
            img.style.height = '135px';
            img.style.objectFit = 'cover';
            card.appendChild(img);
            card.onclick = () => selezionaItem(item);
            grid.appendChild(card);
        });
    } catch {
        titleEl.style.display = 'none';
        grid.innerHTML = '';
    }
}

    let popupItem = null;

    function aggiornaStatoPreferitoPopup(item) {
        const btn = document.getElementById('recModalFavorite');
        if (!btn) return;
        const active = isFavorite(item);
        btn.classList.toggle('active', active);
        btn.textContent = active ? '♥' : '♡';
        btn.setAttribute('aria-pressed', String(active));
        btn.setAttribute('aria-label', active ? 'Rimuovi dai preferiti' : 'Aggiungi ai preferiti');
    }

    async function mostraPopupConsigliato(item) {
        const modal = document.getElementById('recModal');
        const titleEl = document.getElementById('recModalTitle');
        const metaEl = document.getElementById('recModalMeta');
        const overviewEl = document.getElementById('recModalOverview');
        const posterEl = document.getElementById('recModalPoster');

        popupItem = item;

        const nome = currentType === 'movie' ? item.title : item.name;
        const dataUscita = currentType === 'movie' ? item.release_date : item.first_air_date;
        const anno = dataUscita ? dataUscita.substring(0, 4) : 'N/D';
        const voto = item.vote_average ? `★ ${item.vote_average.toFixed(1)}/10` : '';
        const posterPath = item.poster_path
            ? `https://image.tmdb.org/t/p/w342${item.poster_path}`
            : 'https://via.placeholder.com/185x278?text=No+Cover';

        titleEl.textContent = nome || 'Titolo';
        overviewEl.textContent = item.overview || 'Nessuna descrizione disponibile.';
        posterEl.src = posterPath;
        metaEl.innerHTML = '<span>Caricamento dettagli...</span>';
        aggiornaStatoPreferitoPopup(item);
        modal.classList.add('is-open');

        try {
            const [detailsRes, creditsRes] = await Promise.all([
                fetch(`https://api.themoviedb.org/3/${currentType}/${item.id}?api_key=${API_KEY}&language=it-IT`),
                fetch(`https://api.themoviedb.org/3/${currentType}/${item.id}/credits?api_key=${API_KEY}&language=it-IT`)
            ]);

            let runtime = '';
            let countries = '';
            let director = '';

            if (detailsRes.ok) {
                const details = await detailsRes.json();
                runtime = currentType === 'movie' ? formatRuntime(details.runtime) : '';
                countries = formatCountries(details.production_countries || []);
            }

            if (creditsRes.ok) {
                const credits = await creditsRes.json();
                const directorPerson = (credits.crew || []).find(person => person.job === 'Director' || person.department === 'Directing');
                director = directorPerson?.name || '';
            }

            const metaItems = [anno, voto, runtime, countries, director].filter(Boolean);
            metaEl.innerHTML = metaItems.length ? metaItems.map(item => `<span>${item}</span>`).join(' • ') : '<span>Dettagli non disponibili</span>';
        } catch {
            metaEl.innerHTML = '<span>Dettagli non disponibili</span>';
        }
    }

    function chiudiPopupConsigliato() {
        popupItem = null;
        document.getElementById('recModal').classList.remove('is-open');
    }

    function selezionaItem(item) {
        mostraPopupConsigliato(item);
    }

    document.addEventListener('DOMContentLoaded', () => {
        const recModal = document.getElementById('recModal');
        const recModalCard = document.querySelector('.rec-modal-card');
        const sidebar = document.getElementById('sidebar');
        const sidebarToggle = document.getElementById('sidebarToggle');
        const sidebarClose = document.getElementById('sidebarClose');
        const sidebarOverlay = document.getElementById('sidebarOverlay');

        const toggleSidebar = () => {
            const isOpen = sidebar.classList.toggle('is-open');
            sidebarOverlay.classList.toggle('is-open', isOpen);
            sidebarToggle.setAttribute('aria-expanded', String(isOpen));
        };

        const closeSidebar = () => {
            sidebar.classList.remove('is-open');
            sidebarOverlay.classList.remove('is-open');
            sidebarToggle.setAttribute('aria-expanded', 'false');
        };

        if (sidebarToggle) {
            sidebarToggle.addEventListener('click', toggleSidebar);
        }
        if (sidebarClose) {
            sidebarClose.addEventListener('click', closeSidebar);
        }
        if (sidebarOverlay) {
            sidebarOverlay.addEventListener('click', closeSidebar);
        }
        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') {
                closeSidebar();
            }
        });

        recModal.addEventListener('click', (event) => {
            if (event.target === recModal) {
                chiudiPopupConsigliato();
            }
        });

        recModalCard.addEventListener('click', (event) => {
            event.stopPropagation();
        });
    });
    window.onload = () => {
        loadFavorites();
        renderFavoritesSection();
        renderGenreTags();
        caricaPopolari(true);
    };

    function handleLogoError() {
        document.getElementById('logoImg').style.display = 'none';
        document.getElementById('logoText').style.display = 'inline-block';
    }

    function setType(type) {
        currentType = type;
        document.getElementById('btnMovie').classList.toggle('active', type === 'movie');
        document.getElementById('btnTv').classList.toggle('active', type === 'tv');
        
        const frame = document.getElementById('episodesFrame');
        if (type === 'tv') {
            frame.classList.add('active');
        } else {
            frame.classList.remove('active');
        }

        selectedGenreId = null;
        renderGenreTags();
        if (window.innerWidth <= 900) {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            sidebar?.classList.remove('is-open');
            overlay?.classList.remove('is-open');
        }

        const query = document.getElementById('searchInput').value.trim();
        if (!query) {
            caricaPopolari(true);
        } else {
            cerca(true);
        }
    }

    function creaCard(item) {
        const card = document.createElement('div');
        card.className = 'card-item';
        card.tabIndex = 0;

        const posterPath = item.poster_path 
            ? `https://image.tmdb.org/t/p/w342${item.poster_path}`
            : 'https://via.placeholder.com/185x278?text=No+Cover';

        const img = document.createElement('img');
        img.className = 'card-img';
        img.src = posterPath;
        img.alt = currentType === 'movie' ? (item.title || '') : (item.name || '');

        const cardInfo = document.createElement('div');
        cardInfo.className = 'card-info';
        const titleEl = document.createElement('div');
        titleEl.className = 'card-title';
        titleEl.textContent = currentType === 'movie' ? (item.title || '') : (item.name || '');

        cardInfo.appendChild(titleEl);
        card.appendChild(img);
        card.appendChild(cardInfo);
        return card;
    }

    async function caricaPopolari(reset = false) {
        isSearchMode = false;
        if (reset) {
            currentPage = 1;
            risultatiRicerca = [];
            document.getElementById('resultsList').innerHTML = '<div class="status-msg">Caricamento in corso...</div>';
        }
        aggiornaTitoloGriglia();

        await fetchEPopola(`https://api.themoviedb.org/3/trending/${currentType}/week?api_key=${API_KEY}&language=it-IT&page=${currentPage}`, reset);
        currentPage++;
        await fetchEPopola(`https://api.themoviedb.org/3/trending/${currentType}/week?api_key=${API_KEY}&language=it-IT&page=${currentPage}`, false);

        document.getElementById('btnLoadMore').style.display = 'block';
    }

    async function caricaPerGenere(reset = false) {
        isSearchMode = false;
        if (reset) {
            currentPage = 1;
            risultatiRicerca = [];
            document.getElementById('resultsList').innerHTML = '<div class="status-msg">Caricamento in corso...</div>';
        }
        aggiornaTitoloGriglia();

        const discoverBase = `https://api.themoviedb.org/3/discover/${currentType}?api_key=${API_KEY}&language=it-IT&sort_by=popularity.desc&with_genres=${selectedGenreId}`;

        await fetchEPopola(`${discoverBase}&page=${currentPage}`, reset);
        currentPage++;
        await fetchEPopola(`${discoverBase}&page=${currentPage}`, false);

        document.getElementById('btnLoadMore').style.display = 'block';
    }

    async function cercaConPersone(query, page = 1) {
        const yearMatch = query.match(/\b(19|20)\d{2}\b/);
        const year = yearMatch ? yearMatch[0] : null;
        const titleUrl = `https://api.themoviedb.org/3/search/${currentType}?api_key=${API_KEY}&query=${encodeURIComponent(query)}&language=it-IT&page=${page}`;
        const peopleUrl = `https://api.themoviedb.org/3/search/person?api_key=${API_KEY}&query=${encodeURIComponent(query)}&language=it-IT&page=${page}`;
        const yearUrl = year
            ? `https://api.themoviedb.org/3/discover/${currentType}?api_key=${API_KEY}&language=it-IT&sort_by=popularity.desc&page=${page}&${currentType === 'movie' ? 'primary_release_year' : 'first_air_date_year'}=${year}`
            : null;

        const requests = [fetch(titleUrl), fetch(peopleUrl)];
        if (yearUrl) requests.push(fetch(yearUrl));

        const [titleRes, peopleRes, yearRes] = await Promise.all(requests);

        const titleData = titleRes.ok ? await titleRes.json() : { results: [] };
        const peopleData = peopleRes.ok ? await peopleRes.json() : { results: [] };
        const yearData = yearRes?.ok ? await yearRes.json() : { results: [] };

        const combinedResults = [...(titleData.results || [])];
        const seen = new Set(combinedResults.map(item => `${item.id}-${currentType}`));

        const relevantPeople = (peopleData.results || []).filter(person =>
            person && ['Acting', 'Directing'].includes(person.known_for_department)
        ).slice(0, 6);

        const creditsResponses = await Promise.all(relevantPeople.map(async (person) => {
            const creditsUrl = `https://api.themoviedb.org/3/person/${person.id}/${currentType === 'movie' ? 'movie' : 'tv'}_credits?api_key=${API_KEY}&language=it-IT`;
            const creditsRes = await fetch(creditsUrl);
            if (!creditsRes.ok) return [];
            const creditsData = await creditsRes.json();
            const creditItems = [...(creditsData.cast || []), ...(creditsData.crew || [])];
            return creditItems.filter(item => item && item.id && (item.title || item.name));
        }));

        creditsResponses.flat().forEach((item) => {
            const key = `${item.id}-${currentType}`;
            if (!seen.has(key)) {
                seen.add(key);
                combinedResults.push(item);
            }
        });

        (yearData.results || []).forEach((item) => {
            const key = `${item.id}-${currentType}`;
            if (!seen.has(key)) {
                seen.add(key);
                combinedResults.push(item);
            }
        });

        return combinedResults;
    }

    async function cerca(reset = false) {
        const query = document.getElementById('searchInput').value.trim();

        if (!query) {
            ricaricaLista(true);
            return;
        }

        isSearchMode = true;
        if (reset) {
            currentPage = 1;
            risultatiRicerca = [];
            selectedGenreId = null;
            renderGenreTags();
            document.getElementById('resultsList').innerHTML = '<div class="status-msg">Ricerca in corso...</div>';
        }
        aggiornaTitoloGriglia();

        const firstResults = await cercaConPersone(query, currentPage);
        await fetchEPopola(firstResults, reset, null);
        currentPage++;
        const secondResults = await cercaConPersone(query, currentPage);
        await fetchEPopola(secondResults, false, null);

        document.getElementById('btnLoadMore').style.display = 'block';
    }

    function caricaAltriRisultati() {
        currentPage++;
        const query = document.getElementById('searchInput').value.trim();
        if (isSearchMode && query) {
            cercaConPersone(query, currentPage).then(results => {
                fetchEPopola(results, false, null);
            });
        } else if (selectedGenreId) {
            const url = `https://api.themoviedb.org/3/discover/${currentType}?api_key=${API_KEY}&language=it-IT&sort_by=popularity.desc&with_genres=${selectedGenreId}&page=${currentPage}`;
            fetchEPopola(url, false);
        } else {
            const url = `https://api.themoviedb.org/3/trending/${currentType}/week?api_key=${API_KEY}&language=it-IT&page=${currentPage}`;
            fetchEPopola(url, false);
        }
    }

    async function fetchEPopola(input, resetGrid = false, genreFilter = null) {
        const listContainer = document.getElementById('resultsList');

        try {
            let results = [];

            if (Array.isArray(input)) {
                results = input;
            } else {
                const response = await fetch(input);
                if (!response.ok) {
                    throw new Error(`API ${response.status}`);
                }
                const data = await response.json();
                results = data.results || [];
            }

            if (genreFilter) {
                results = results.filter(item => (item.genre_ids || []).includes(genreFilter));
            }

            if (resetGrid) {
                listContainer.innerHTML = '';
            }

            if (results.length === 0 && risultatiRicerca.length === 0) {
                listContainer.innerHTML = '<div class="status-msg">Nessun contenuto trovato.</div>';
                document.getElementById('btnLoadMore').style.display = 'none';
                return;
            }

            const startIndex = risultatiRicerca.length;

            results.forEach((item) => {
                risultatiRicerca.push(item);
                const currentIndex = risultatiRicerca.length - 1;

                const nome = currentType === 'movie' ? item.title : item.name;
                const posterPath = item.poster_path 
                    ? `https://image.tmdb.org/t/p/w342${item.poster_path}`
                    : 'https://via.placeholder.com/185x278?text=No+Cover';

                const card = creaCard({
                    poster_path: item.poster_path,
                    title: item.title,
                    name: item.name
                });
                card.tabIndex = 0;

                const titleEl = card.querySelector('.card-title');
                titleEl.textContent = nome || '';

                card.onfocus = () => aggiornaHero(currentIndex);
                card.onclick = () => {
                    aggiornaHero(currentIndex);
                    document.getElementById('btnPlay').focus();
                };

                card.onkeydown = (e) => {
                    if (e.key === 'Enter' || e.keyCode === 13) {
                        aggiornaHero(currentIndex);
                        document.getElementById('btnPlay').focus();
                    }
                };

                const delayIndex = currentIndex - startIndex;
                if (delayIndex <= 14) {
                    card.style.animationDelay = `${delayIndex * 35}ms`;
                }

                listContainer.appendChild(card);
            });

            if (startIndex === 0 && risultatiRicerca.length > 0) {
                aggiornaHero(0);
            }

        } catch (err) {
            if (risultatiRicerca.length === 0) {
                listContainer.innerHTML = `<div class="status-msg">Errore di connessione: ${err.message}</div>`;
            }
        }
    }

    function estraiColoreDominante(src) {
        return new Promise((resolve) => {
            const img = new Image();
            const proxyUrl = `https://images.weserv.nl/?w=64&h=64&output=jpg&url=${encodeURIComponent(src)}`;

            img.onload = () => {
                try {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const size = 64;
                    canvas.width = size;
                    canvas.height = size;
                    ctx.drawImage(img, 0, 0, size, size);

                    const data = ctx.getImageData(0, 0, size, size).data;
                    const buckets = new Map();

                    for (let i = 0; i < data.length; i += 4) {
                        const alpha = data[i + 3];
                        if (alpha < 128) continue;

                        const r = Math.round(data[i] / 32) * 32;
                        const g = Math.round(data[i + 1] / 32) * 32;
                        const b = Math.round(data[i + 2] / 32) * 32;
                        const key = `${r},${g},${b}`;
                        buckets.set(key, (buckets.get(key) || 0) + 1);
                    }

                    let bestKey = null;
                    let bestCount = 0;
                    buckets.forEach((count, key) => {
                        if (count > bestCount) {
                            bestCount = count;
                            bestKey = key;
                        }
                    });

                    if (bestKey) {
                        const [r, g, b] = bestKey.split(',').map(Number);
                        resolve(`rgb(${r}, ${g}, ${b})`);
                    } else {
                        resolve('#141414');
                    }
                } catch {
                    resolve('#141414');
                }
            };
            img.onerror = () => resolve('#141414');
            img.src = proxyUrl;
        });
    }

    async function aggiornaSelectSerie(tvItem) {
        const seasonSelect = document.getElementById('seasonInput');
        const episodeSelect = document.getElementById('episodeInput');

        if (!tvItem || currentType !== 'tv') {
            seasonSelect.innerHTML = '';
            episodeSelect.innerHTML = '';
            return;
        }

        let seasonsData = Array.isArray(tvItem.seasons) ? tvItem.seasons : [];

        if (!seasonsData.length) {
            try {
                const res = await fetch(`https://api.themoviedb.org/3/tv/${tvItem.id}?api_key=${API_KEY}&language=it-IT`);
                if (res.ok) {
                    const detail = await res.json();
                    seasonsData = Array.isArray(detail.seasons) ? detail.seasons : [];
                }
            } catch {
                seasonsData = [];
            }
        }

        const seasonCount = Math.max(1, seasonsData.length || tvItem.number_of_seasons || 1);
        const seasonOptions = [];
        for (let s = 1; s <= seasonCount; s++) {
            const seasonInfo = seasonsData.find(entry => entry.season_number === s);
            const epCount = seasonInfo?.episode_count || 1;
            seasonOptions.push(`<option value="${s}">Stagione ${s}${epCount ? ` (${epCount} ep)` : ''}</option>`);
        }
        seasonSelect.innerHTML = seasonOptions.join('');
        seasonSelect.value = '1';

        const aggiornaEpisodi = (selectedSeason) => {
            const seasonInfo = seasonsData.find(entry => entry.season_number === selectedSeason);
            const episodeCount = Math.max(1, seasonInfo?.episode_count || 1);
            const episodeOptions = [];
            for (let e = 1; e <= episodeCount; e++) {
                episodeOptions.push(`<option value="${e}">Episodio ${e}</option>`);
            }
            episodeSelect.innerHTML = episodeOptions.join('');
            episodeSelect.value = '1';
        };

        seasonSelect.onchange = () => {
            aggiornaEpisodi(parseInt(seasonSelect.value || '1', 10));
        };

        aggiornaEpisodi(1);
    }

    function formatRuntime(minutes) {
        if (!minutes) return '';
        const hours = Math.floor(minutes / 60);
        const mins = minutes % 60;
        return hours ? `${hours}h ${mins}m` : `${mins}m`;
    }

    function formatCountries(countries) {
        if (!Array.isArray(countries) || !countries.length) return '';
        return countries.map(country => country.name || country.iso_3166_1).filter(Boolean).join(', ');
    }

    async function aggiornaHeroDaItem(item) {

        heroSection.classList.remove('hero-animate');
        void heroSection.offsetWidth;
        heroSection.classList.add('hero-animate');

        const mediaType = elementoSelezionato.type || currentType;
        const nome = mediaType === 'movie' ? elementoSelezionato.title : elementoSelezionato.name;
        const dataUscita = mediaType === 'movie' ? elementoSelezionato.release_date : elementoSelezionato.first_air_date;
        const anno = dataUscita ? dataUscita.substring(0, 4) : 'N/D';
        const voto = elementoSelezionato.vote_average ? `★ ${elementoSelezionato.vote_average.toFixed(1)}/10` : '';

        document.getElementById('heroTitle').innerText = nome;
        document.getElementById('heroOverview').innerText = elementoSelezionato.overview || 'Nessuna descrizione disponibile.';

        try {
            const detailRes = await fetch(`https://api.themoviedb.org/3/${mediaType}/${elementoSelezionato.id}?api_key=${API_KEY}&language=it-IT`);
            if (detailRes.ok) {
                const details = await detailRes.json();
                const runtime = mediaType === 'movie' ? details.runtime : '';
                const countries = formatCountries(details.production_countries || []);
                const detailsMeta = [anno, voto, runtime ? formatRuntime(runtime) : '', countries].filter(Boolean);
                document.getElementById('heroMeta').innerText = detailsMeta.join(' • ');
            } else {
                document.getElementById('heroMeta').innerText = `${anno} • ${voto}`;
            }
        } catch {
            document.getElementById('heroMeta').innerText = `${anno} • ${voto}`;
        }

        const posterPath = elementoSelezionato.poster_path
            ? `https://image.tmdb.org/t/p/w342${elementoSelezionato.poster_path}`
            : 'https://via.placeholder.com/185x278?text=No+Cover';
        document.getElementById('heroPoster').src = posterPath;

            await aggiornaSelectSerie(elementoSelezionato);
        } else {
            document.getElementById('seasonInput').innerHTML = '';
            document.getElementById('episodeInput').innerHTML = '';

        document.documentElement.style.setProperty('--bg-color', dominantColor);

        document.body.style.backgroundImage = 'linear-gradient(180deg, rgba(255,255,255,0.03) 0%, rgba(0,0,0,0.10) 100%)';
        document.body.style.backgroundAttachment = 'fixed';
        document.body.style.backgroundRepeat = 'no-repeat';
        document.body.style.backgroundSize = 'cover';

        const backdropImg = document.getElementById('backdropImg');
        const bgPath = elementoSelezionato.backdrop_path || elementoSelezionato.poster_path;

        if (bgPath) {
            const imgUrl = `https://image.tmdb.org/t/p/w1280${bgPath}`;
            backdropImg.onload = () => {
                backdropImg.style.opacity = '1';
            };
            backdropImg.src = imgUrl;
        } else {
            backdropImg.style.opacity = '0';
        }

        fetchRecommendations(elementoSelezionato.id, mediaType);
        if (currentView === 'favorites') {
            renderFavoritesSection();
        }
    }

    function apriLinkEsterno(url) {
        try {
            const popup = window.open(url, '_blank', 'noopener,noreferrer');
            if (popup) {
                popup.opener = null;
                return;
            }
        } catch {}

        try {
            const link = document.createElement('a');
            link.href = url;
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            document.body.appendChild(link);
            link.click();
            link.remove();
        } catch {
            alert('Impossibile aprire il link automaticamente. Copia l’indirizzo manualmente.');
        }
    }

    function riproduciInPagina(item = elementoSelezionato) {
        if (!item) {
            alert("Seleziona prima un elemento!");
            return;
        }

        const tmdbId = item.id;
        let url = "";

        if (currentType === 'movie') {
            url = `https://vixsrc.to/movie/${tmdbId}/`;
        } else {
            const season = document.getElementById('seasonInput').value || '1';
            const episode = document.getElementById('episodeInput').value || '1';
            url = `https://vixsrc.to/tv/${tmdbId}/${season}/${episode}/`;
        }

        apriLinkEsterno(url);
    }

    async function showTrailer(item = elementoSelezionato) {
        if (!item) return alert("Seleziona prima un titolo");
        try {
            const res = await fetch(`https://api.themoviedb.org/3/${currentType}/${item.id}/videos?api_key=${API_KEY}&language=it-IT`);
            if (!res.ok) {
                alert("Impossibile aprire il trailer.");
                return;
            }
            const data = await res.json();
            const videos = data.results || [];
            const trailer = videos.find(v => v.site === 'YouTube' && (v.type === 'Trailer' || v.type === 'Teaser' || v.type === 'Featurette'))
                || videos.find(v => v.site === 'YouTube')
                || null;

            if (trailer) {
                const youtubeUrl = `https://www.youtube.com/watch?v=${trailer.key}`;
                apriLinkEsterno(youtubeUrl);
            } else {
                alert("Trailer non disponibile");
            }
        } catch {
            alert("Errore di connessione durante l'apertura del trailer.");
        }
    }

    function guardaDalPopup() {
        if (!popupItem) return;
        riproduciInPagina(popupItem);
    }

    async function apriTramaCompleta() {
        if (!elementoSelezionato) return;
        const modal = document.getElementById('overviewModal');
        const titleEl = document.getElementById('overviewModalTitle');
        const metaEl = document.getElementById('overviewModalMeta');
        const textEl = document.getElementById('overviewModalText');
        const castEl = document.getElementById('overviewModalCast');
        const title = currentType === 'movie' ? elementoSelezionato.title : elementoSelezionato.name;
        const text = elementoSelezionato.overview || 'Nessuna trama disponibile.';
        titleEl.textContent = title || 'Trama';
        textEl.textContent = text;
        metaEl.innerHTML = '';
        castEl.innerHTML = '<div class="favorites-empty">Caricamento cast...</div>';
        modal.classList.add('is-open');

        try {
            const [detailsRes, creditsRes] = await Promise.all([
                fetch(`https://api.themoviedb.org/3/${currentType}/${elementoSelezionato.id}?api_key=${API_KEY}&language=it-IT`),
                fetch(`https://api.themoviedb.org/3/${currentType}/${elementoSelezionato.id}/credits?api_key=${API_KEY}&language=it-IT`)
            ]);

            if (detailsRes.ok) {
                const details = await detailsRes.json();
                const runtime = currentType === 'movie' ? formatRuntime(details.runtime) : '';
                const countries = formatCountries(details.production_countries || []);
                const infoItems = [runtime, countries].filter(Boolean);
                metaEl.innerHTML = infoItems.length ? infoItems.map(item => `<span>${item}</span>`).join('') : '<span>Informazioni non disponibili</span>';
            } else {
                metaEl.innerHTML = '<span>Informazioni non disponibili</span>';
            }

            if (creditsRes.ok) {
                const credits = await creditsRes.json();
                const cast = (credits.cast || []).slice(0, 6);
                const director = (credits.crew || []).find(person => person.job === 'Director' || person.department === 'Directing');
                const castMarkup = cast.map(actor => {
                    const photo = actor.profile_path
                        ? `https://image.tmdb.org/t/p/w185${actor.profile_path}`
                        : 'https://via.placeholder.com/185x278?text=No+Photo';
                    return `
                        <div class="overview-modal-actor">
                            <img src="${photo}" alt="${actor.name || ''}">
                            <div class="overview-modal-actor-name">${actor.name || 'Sconosciuto'}</div>
                            <div class="overview-modal-actor-role">${actor.character || 'Cast'}</div>
                        </div>`;
                }).join('');
                castEl.innerHTML = castMarkup || '<div class="favorites-empty">Nessun cast disponibile.</div>';
                if (director) {
                    const directorBlock = document.createElement('div');
                    directorBlock.className = 'overview-modal-actor';
                    directorBlock.innerHTML = `<div class="overview-modal-actor-name">Regista</div><div class="overview-modal-actor-role">${director.name || 'Sconosciuto'}</div>`;
                    castEl.appendChild(directorBlock);
                }
            } else {
                castEl.innerHTML = '<div class="favorites-empty">Nessun cast disponibile.</div>';
            }
        } catch {
            metaEl.innerHTML = '<span>Informazioni non disponibili</span>';
            castEl.innerHTML = '<div class="favorites-empty">Errore nel caricamento dei dettagli.</div>';
        }
    }

    function chiudiTramaModal() {
        document.getElementById('overviewModal').classList.remove('is-open');
    }
