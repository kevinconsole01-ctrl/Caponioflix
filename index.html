<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caponioflix</title>
    <style>
        :root {
            --bg-color: #0f0f11;
            --card-bg: #1a1a1e;
            --list-bg: #141417;
            --text-color: #f0f0f2;
            --text-muted: #a0a0aa;
            --accent-green: #22c55e;
            --border-color: #27272a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background-color: var(--bg-color);
            border-radius: 12px;
            padding: 20px;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 15px;
        }

        .app-logo {
            max-width: 180px;
            height: auto;
            display: block;
            margin: 0 auto;
            border-radius: 8px;
        }

        h1 {
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #ffffff;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .type-selector {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 15px;
        }

        .type-selector label {
            cursor: pointer;
            font-weight: bold;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-radius: 6px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="text"], input[type="number"] {
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            padding: 10px 14px;
            font-size: 1rem;
            outline: none;
        }

        /* Gestione focus visivo per Fire TV */
        button:focus, 
        input:focus, 
        .type-selector label:focus-within {
            outline: 3px solid #ffffff !important;
            border-color: #ffffff !important;
        }

        .search-box input[type="text"] {
            flex-grow: 1;
        }

        button {
            background-color: #ffffff;
            color: #000000;
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
        }

        .episodes-frame {
            display: none;
            background-color: var(--card-bg);
            padding: 12px;
            border-radius: 8px;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
        }

        .episodes-frame.active {
            display: flex;
        }

        .episodes-frame input {
            width: 60px;
            text-align: center;
        }

        /* Griglia dei risultati con locandine */
        .results-list {
            background-color: var(--list-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            max-height: 420px;
            overflow-y: auto;
            margin-bottom: 15px;
            padding: 10px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 12px;
        }

        /* Card del singolo film / serie */
        .result-item-btn {
            background: var(--card-bg);
            color: var(--text-color);
            border: 2px solid transparent;
            border-radius: 8px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .poster-img {
            width: 100%;
            height: 170px;
            object-fit: cover;
            border-radius: 6px;
            background-color: #27272a;
            margin-bottom: 8px;
        }

        .item-title {
            font-size: 0.85rem;
            font-weight: 600;
            line-height: 1.2;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .result-item-btn:focus {
            background-color: #3f3f46 !important;
            border-color: #ffffff !important;
            transform: scale(1.03);
        }

        .result-item-btn.selected {
            border-color: var(--accent-green) !important;
            background-color: #1c3829 !important;
        }

        .btn-open {
            width: 100%;
            background-color: var(--accent-green);
            color: #ffffff;
            margin-bottom: 20px;
            padding: 14px;
            font-size: 1.1rem;
        }

        .btn-open:focus {
            background-color: #16a34a !important;
        }

        .status-msg {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--text-muted);
            padding: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo-container">
        <img src="logo.png" alt="Logo Caponioflix" class="app-logo">
    </div>

    <h1></h1>

    <div class="type-selector">
        <label tabindex="0">
            <input type="radio" name="searchType" value="movie" checked onchange="toggleType()"> Film
        </label>
        <label tabindex="0">
            <input type="radio" name="searchType" value="tv" onchange="toggleType()"> Serie TV
        </label>
    </div>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Cerca film o serie TV..." onkeydown="if(event.key === 'Enter') cerca()">
        <button onclick="cerca()" tabindex="0">Cerca</button>
    </div>

    <div class="episodes-frame" id="episodesFrame">
        <label>Stagione: <input type="number" id="seasonInput" value="1" min="1"></label>
        <label>Episodio: <input type="number" id="episodeInput" value="1" min="1"></label>
    </div>

    <div class="results-list" id="resultsList">
        <div class="status-msg">Effettua una ricerca...</div>
    </div>

    <button class="btn-open" onclick="riproduciInPagina()" tabindex="0">▶ Guarda Stream</button>
</div>

<script>
    const API_KEY = "19a3e7d1a5356e8daa2323dabc5e1a2d";

    let risultatiRicerca = [];
    let elementoSelezionato = null;

    function toggleType() {
        const type = document.querySelector('input[name="searchType"]:checked').value;
        const frame = document.getElementById('episodesFrame');
        if (type === 'tv') {
            frame.classList.add('active');
        } else {
            frame.classList.remove('active');
        }
    }

    async function cerca() {
        const query = document.getElementById('searchInput').value.trim();
        const type = document.querySelector('input[name="searchType"]:checked').value;
        const listContainer = document.getElementById('resultsList');

        if (!query) return;

        listContainer.innerHTML = '<div class="status-msg">Ricerca in corso...</div>';
        risultatiRicerca = [];
        elementoSelezionato = null;

        const url = `https://api.themoviedb.org/3/search/${type}?api_key=${API_KEY}&query=${encodeURIComponent(query)}&language=it-IT`;

        try {
            const response = await fetch(url);
            const data = await response.json();
            const results = data.results || [];

            listContainer.innerHTML = '';

            if (results.length === 0) {
                listContainer.innerHTML = '<div class="status-msg">Nessun risultato trovato.</div>';
                return;
            }

            results.slice(0, 15).forEach((item, index) => {
                risultatiRicerca.push(item);

                const nome = type === 'movie' ? item.title : item.name;
                const dataUscita = type === 'movie' ? item.release_date : item.first_air_date;
                const anno = dataUscita ? ` (${dataUscita.substring(0, 4)})` : '';
                
                // URL della locandina TMDB (w185 = dimensione ottima per le card)
                const posterPath = item.poster_path 
                    ? `https://image.tmdb.org/t/p/w185${item.poster_path}`
                    : 'https://via.placeholder.com/185x278?text=No+Cover';

                const btn = document.createElement('button');
                btn.className = 'result-item-btn';
                btn.type = 'button';
                btn.tabIndex = 0;
                
                btn.innerHTML = `
                    <img class="poster-img" src="${posterPath}" alt="${nome}" />
                    <span class="item-title">${nome}${anno}</span>
                `;
                
                btn.onclick = () => {
                    selezionaVoce(btn, index);
                };

                listContainer.appendChild(btn);
            });

        } catch (err) {
            listContainer.innerHTML = `<div class="status-msg">Errore: ${err.message}</div>`;
        }
    }

    function selezionaVoce(element, index) {
        document.querySelectorAll('.result-item-btn').forEach(el => el.classList.remove('selected'));
        element.classList.add('selected');
        elementoSelezionato = risultatiRicerca[index];
    }

    function riproduciInPagina() {
        if (!elementoSelezionato) {
            alert("Seleziona prima un elemento dalla lista!");
            return;
        }

        const type = document.querySelector('input[name="searchType"]:checked').value;
        const tmdbId = elementoSelezionato.id;
        let url = "";

        if (type === 'movie') {
            url = `https://vixsrc.to/movie/${tmdbId}/`;
        } else {
            const season = document.getElementById('seasonInput').value || '1';
            const episode = document.getElementById('episodeInput').value || '1';
            url = `https://vixsrc.to/tv/${tmdbId}/${season}/${episode}/`;
        }

        window.open(url, '_blank');
    }
</script>

</body>
</html>
