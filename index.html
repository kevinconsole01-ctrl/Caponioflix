<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <!-- Viewport ottimizzato per bloccare lo scorrimento orizzontale su mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Caponioflix Premium</title>
    <style>
        :root {
            --bg-color: #141414;
            --card-bg: #1f1f1f;
            --accent: #e50914; /* Rosso stile Netflix */
            --text-color: #ffffff;
            --text-muted: #aaaaaa;
            --border-color: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            max-width: 100%;
            overflow-x: hidden; /* Blocca definitivamente lo scorrimento orizzontale */
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
        }

        /* SFONDO DINAMICO (Backdrop sfocato) */
        .backdrop-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-size: cover;
            background-position: center top;
            filter: brightness(0.25) blur(8px);
            z-index: -1;
            transition: background-image 0.5s ease-in-out;
        }

        .main-layout {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* HEADER / NAVBAR */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
        }

        /* Contenitore Logo con fallback testo */
        .logo-wrapper {
            display: flex;
            align-items: center;
        }

        .app-logo {
            max-height: 40px;
            width: auto;
            max-width: 160px;
            object-fit: contain;
        }

        .logo-fallback {
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--accent);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* CONTROLLI DI RICERCA */
        .controls-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .type-selector {
            display: flex;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            padding: 3px;
            border: 1px solid var(--border-color);
        }

        .type-btn {
            padding: 8px 14px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .type-btn.active {
            background: var(--accent);
            color: #fff;
        }

        .search-box {
            display: flex;
            gap: 8px;
            flex-grow: 1;
        }

        input[type="text"], input[type="number"] {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            padding: 10px 12px;
            font-size: 0.95rem;
            outline: none;
            width: 100%;
        }

        input[type="text"] { 
            flex-grow: 1; 
            min-width: 0; /* Previene overflow del campo input */
        }

        .btn-action {
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 10px 18px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
        }

        /* SEZIONE HERO (Dettagli Elemento Selezionato) */
        .hero-section {
            display: flex;
            gap: 20px;
            background: rgba(20, 20, 20, 0.75);
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            width: 100%;
            align-items: center;
        }

        .hero-poster {
            width: 130px;
            height: 195px;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            flex-shrink: 0;
        }

        .hero-details {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-grow: 1;
            min-width: 0; /* Permette il truncate corretto del testo */
        }

        .hero-title {
            font-size: 1.6rem;
            font-weight: 700;
            word-wrap: break-word;
        }

        .hero-meta {
            display: flex;
            gap: 12px;
            align-items: center;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .hero-overview {
            font-size: 0.9rem;
            color: #ccc;
            line-height: 1.4;
            max-height: 70px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
        }

        .episodes-selector {
            display: none;
            gap: 10px;
            align-items: center;
            margin-top: 5px;
            flex-wrap: wrap;
        }

        .episodes-selector.active {
            display: flex;
        }

        .episodes-selector input {
            width: 65px;
            text-align: center;
        }

        /* RISULTATI */
        .section-title {
            font-size: 1.1rem;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .results-grid {
            display: grid;
            /* Griglia pienamente reattiva */
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 12px;
            max-height: 480px;
            overflow-y: auto;
            padding: 4px;
            width: 100%;
        }

        .card-item {
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .card-img {
            width: 100%;
            height: 175px;
            object-fit: cover;
            display: block;
        }

        .card-info {
            padding: 8px;
        }

        .card-title {
            font-size: 0.8rem;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* REGOLE DI FOCUS DEDICATE A FIRE TV E TOUCH */
        button:focus, 
        input:focus, 
        .card-item:focus {
            outline: none !important;
            border-color: #ffffff !important;
            transform: scale(1.05);
            z-index: 10;
            box-shadow: 0 8px 20px rgba(229, 9, 20, 0.5);
        }

        .card-item.selected {
            border-color: var(--accent);
        }

        .btn-play-large {
            background: var(--accent);
            color: #fff;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: fit-content;
            margin-top: 5px;
        }

        .status-msg {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--text-muted);
            padding: 30px;
            font-size: 0.95rem;
        }

        /* =========================================================
           STILI ADATTIVI PER SMARTPHONE E TABLET (MOBILE RESPONSIVE)
           ========================================================= */
        @media (max-width: 600px) {
            .main-layout {
                padding: 12px;
                gap: 15px;
            }

            header {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }

            .logo-wrapper {
                justify-content: center;
            }

            .controls-bar {
                flex-direction: column;
                width: 100%;
            }

            .type-selector {
                width: 100%;
            }

            .type-btn {
                flex: 1;
                text-align: center;
            }

            .search-box {
                width: 100%;
            }

            .hero-section {
                flex-direction: column;
                text-align: center;
                padding: 16px;
            }

            .hero-poster {
                width: 110px;
                height: 165px;
            }

            .hero-details {
                align-items: center;
                width: 100%;
            }

            .hero-title {
                font-size: 1.3rem;
            }

            .btn-play-large {
                width: 100%; /* Pulsante a tutta larghezza per facilitare il tocco su mobile */
            }

            .episodes-selector {
                justify-content: center;
            }

            .results-grid {
                /* Riduce le colonne su telefoni stretti per mostrare 2-3 locandine perfette per riga */
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
                gap: 8px;
            }

            .card-img {
                height: 145px;
            }
        }
    </style>
</head>
<body>

<div class="backdrop-bg" id="backdrop"></div>

<div class="main-layout">
    <header>
        <div class="logo-wrapper">
            <!-- Tenta di caricare logo.png, se fallisce passa al testo 'CAPONIOFLIX' -->
            <img src="logo.png" alt="Caponioflix" class="app-logo" id="logoImg" onerror="handleLogoError()">
            <span class="logo-fallback" id="logoText" style="display: none;">CAPONIOFLIX</span>
        </div>

        <div class="controls-bar">
            <div class="type-selector">
                <button class="type-btn active" id="btnMovie" onclick="setType('movie')" tabindex="0">Film</button>
                <button class="type-btn" id="btnTv" onclick="setType('tv')" tabindex="0">Serie TV</button>
            </div>
            
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Cerca titolo..." onkeydown="if(event.key === 'Enter') cerca()" tabindex="0">
                <button class="btn-action" onclick="cerca()" tabindex="0">Cerca</button>
            </div>
        </div>
    </header>

    <!-- SEZIONE HERO -->
    <div class="hero-section" id="heroSection">
        <img class="hero-poster" id="heroPoster" src="https://via.placeholder.com/185x278?text=Seleziona" alt="Poster">
        <div class="hero-details">
            <div class="hero-title" id="heroTitle">Seleziona un titolo</div>
            <div class="hero-meta" id="heroMeta">---</div>
            <div class="hero-overview" id="heroOverview">Cerca e seleziona un contenuto per vederne i dettagli e avviarlo.</div>
            
            <div class="episodes-selector" id="episodesFrame">
                <label>Stagione: <input type="number" id="seasonInput" value="1" min="1" tabindex="0"></label>
                <label>Episodio: <input type="number" id="episodeInput" value="1" min="1" tabindex="0"></label>
            </div>

            <button class="btn-play-large" id="btnPlay" onclick="riproduciInPagina()" tabindex="0">
                ▶ GUARDA ORA
            </button>
        </div>
    </div>

    <!-- LISTA RISULTATI -->
    <div>
        <div class="section-title">Risultati della ricerca</div>
        <div class="results-grid" id="resultsList">
            <div class="status-msg">Usa la barra sopra per cercare un contenuto.</div>
        </div>
    </div>
</div>

<script>
    const API_KEY = "19a3e7d1a5356e8daa2323dabc5e1a2d";
    let currentType = 'movie';
    let risultatiRicerca = [];
    let elementoSelezionato = null;

    // Gestione errore caricamento logo
    function handleLogoError() {
        document.getElementById('logoImg').style.display = 'none';
        document.getElementById('logoText').style.display = 'inline-block';
    }

    function setType(type) {
        currentType = type;
        document.getElementById('btnMovie').classList.toggle('active', type === 'movie');
        document.getElementById('btnTv').classList.toggle('active', type === 'tv');
        
        const frame = document.getElementById('episodesFrame');
        if (type === 'tv') {
            frame.classList.add('active');
        } else {
            frame.classList.remove('active');
        }
    }

    async function cerca() {
        const query = document.getElementById('searchInput').value.trim();
        const listContainer = document.getElementById('resultsList');

        if (!query) return;

        listContainer.innerHTML = '<div class="status-msg">Ricerca in corso...</div>';
        risultatiRicerca = [];
        elementoSelezionato = null;

        const url = `https://api.themoviedb.org/3/search/${currentType}?api_key=${API_KEY}&query=${encodeURIComponent(query)}&language=it-IT`;

        try {
            const response = await fetch(url);
            const data = await response.json();
            const results = data.results || [];

            listContainer.innerHTML = '';

            if (results.length === 0) {
                listContainer.innerHTML = '<div class="status-msg">Nessun risultato trovato.</div>';
                return;
            }

            results.slice(0, 18).forEach((item, index) => {
                risultatiRicerca.push(item);

                const nome = currentType === 'movie' ? item.title : item.name;
                const posterPath = item.poster_path 
                    ? `https://image.tmdb.org/t/p/w342${item.poster_path}`
                    : 'https://via.placeholder.com/185x278?text=No+Cover';

                const card = document.createElement('div');
                card.className = 'card-item';
                card.tabIndex = 0;
                
                card.innerHTML = `
                    <img class="card-img" src="${posterPath}" alt="${nome}" />
                    <div class="card-info">
                        <div class="card-title">${nome}</div>
                    </div>
                `;

                card.onfocus = () => aggiornaHero(index);
                card.onclick = () => {
                    aggiornaHero(index);
                    document.getElementById('btnPlay').focus();
                };

                card.onkeydown = (e) => {
                    if (e.key === 'Enter' || e.keyCode === 13) {
                        aggiornaHero(index);
                        document.getElementById('btnPlay').focus();
                    }
                };

                listContainer.appendChild(card);
            });

            setTimeout(() => {
                const primaCard = listContainer.querySelector('.card-item');
                if (primaCard) {
                    primaCard.focus();
                    aggiornaHero(0);
                }
            }, 100);

        } catch (err) {
            listContainer.innerHTML = `<div class="status-msg">Errore: ${err.message}</div>`;
        }
    }

    function aggiornaHero(index) {
        elementoSelezionato = risultatiRicerca[index];
        if (!elementoSelezionato) return;

        document.querySelectorAll('.card-item').forEach((el, i) => {
            el.classList.toggle('selected', i === index);
        });

        const item = elementoSelezionato;
        const nome = currentType === 'movie' ? item.title : item.name;
        const dataUscita = currentType === 'movie' ? item.release_date : item.first_air_date;
        const anno = dataUscita ? dataUscita.substring(0, 4) : 'N/D';
        const voto = item.vote_average ? `★ ${item.vote_average.toFixed(1)}/10` : '';

        document.getElementById('heroTitle').innerText = nome;
        document.getElementById('heroMeta').innerText = `${anno} • ${voto}`;
        document.getElementById('heroOverview').innerText = item.overview || 'Nessuna descrizione disponibile.';

        const posterPath = item.poster_path 
            ? `https://image.tmdb.org/t/p/w342${item.poster_path}`
            : 'https://via.placeholder.com/185x278?text=No+Cover';
        document.getElementById('heroPoster').src = posterPath;

        const backdropEl = document.getElementById('backdrop');
        if (item.backdrop_path) {
            backdropEl.style.backgroundImage = `url('https://image.tmdb.org/t/p/w1280${item.backdrop_path}')`;
        } else {
            backdropEl.style.backgroundImage = 'none';
        }
    }

    function riproduciInPagina() {
        if (!elementoSelezionato) {
            alert("Seleziona prima un elemento dalla lista!");
            return;
        }

        const tmdbId = elementoSelezionato.id;
        let url = "";

        if (currentType === 'movie') {
            url = `https://vixsrc.to/movie/${tmdbId}/`;
        } else {
            const season = document.getElementById('seasonInput').value || '1';
            const episode = document.getElementById('episodeInput').value || '1';
            url = `https://vixsrc.to/tv/${tmdbId}/${season}/${episode}/`;
        }

        window.open(url, '_blank');
    }
</script>

</body>
</html>
