<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Caponioflix Premium</title>
    <link rel="icon" type="image/png" href="Nuovo progetto (1).png">
    <style>
        :root {
            --bg-color: #141414;
            --card-bg: #1f1f1f;
            --accent: #e50914; /* Rosso stile Netflix */
            --text-color: #ffffff;
            --text-muted: #aaaaaa;
            --border-color: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            position: relative;
        }

        /* SFONDO DINAMICO (GESTITO VIA IMG HTML PER MAX COMPATIBILITÀ CHROME) */
        #backdropContainer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -2;
            overflow: hidden;
        }

        #backdropImg {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: blur(10px) brightness(0.4);
            transform: scale(1.1); /* Evita bordi sfocati bianchi ai lati */
            transition: opacity 0.5s ease-in-out;
            opacity: 0;
        }

        /* SFUMATURA SCURA IN SOVRAPPOSIZIONE PER LA LEGGIBILITÀ */
        .backdrop-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(180deg, rgba(20,20,20,0.4) 0%, rgba(20,20,20,0.85) 60%, #141414 100%);
            z-index: -1;
            pointer-events: none;
        }

        .main-layout {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: relative;
            z-index: 1;
        }

        /* HEADER / NAVBAR */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            width: 100%;
        }

        .logo-wrapper {
            display: flex;
            align-items: center;
        }

        .app-logo {
            max-height: 40px;
            width: auto;
            max-width: 160px;
            object-fit: contain;
        }

        .logo-fallback {
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--accent);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* CONTROLLI DI RICERCA */
        .controls-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .type-selector {
            display: flex;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 8px;
            padding: 3px;
            border: 1px solid var(--border-color);
        }

        .type-btn {
            padding: 8px 14px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .type-btn.active {
            background: var(--accent);
            color: #fff;
        }

        .search-box {
            display: flex;
            gap: 8px;
            flex-grow: 1;
        }

        input[type="text"], input[type="number"] {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            padding: 10px 12px;
            font-size: 0.95rem;
            outline: none;
            width: 100%;
        }

        input[type="text"] { 
            flex-grow: 1; 
            min-width: 0;
        }

        .btn-action {
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 10px 18px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
        }
        

        /* SEZIONE HERO */
        .hero-section {
            display: flex;
            gap: 20px;
            background: rgba(20, 20, 20, 0.65);
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            width: 100%;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .hero-poster {
            width: 130px;
            height: 195px;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.8);
            flex-shrink: 0;
        }

        .hero-details {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-grow: 1;
            min-width: 0;
        }

        .hero-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            margin-top: 5px;
        }

        .btn-trailer {
            background: #555;
        }

        .hero-title {
            font-size: 1.6rem;
            font-weight: 700;
            word-wrap: break-word;
        }

        .hero-meta {
            display: flex;
            gap: 12px;
            align-items: center;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .hero-overview {
            font-size: 0.9rem;
            color: #ccc;
            line-height: 1.4;
            max-height: 70px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
        }

        .episodes-selector {
            display: none;
            gap: 10px;
            align-items: center;
            margin-top: 5px;
            flex-wrap: wrap;
        }

        .episodes-selector.active {
            display: flex;
        }

        .episodes-selector input {
            width: 65px;
            text-align: center;
        }

        /* RISULTATI / POPOLARI */
        .section-title {
            font-size: 1.1rem;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 12px;
            max-height: 520px;
            overflow-y: auto;
            padding: 4px;
            width: 100%;
        }

        .card-item {
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .card-img {
            width: 100%;
            height: 175px;
            object-fit: cover;
            display: block;
        }

        .card-info {
            padding: 8px;
        }

        .card-title {
            font-size: 0.8rem;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        button:focus, 
        input:focus, 
        .card-item:focus {
            outline: none !important;
            border-color: #ffffff !important;
            transform: scale(1.05);
            z-index: 10;
            box-shadow: 0 8px 20px rgba(229, 9, 20, 0.5);
        }

        .card-item.selected {
            border-color: var(--accent);
        }

        .btn-play-large {
            background: var(--accent);
            color: #fff;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: fit-content;
            margin-top: 5px;
        }

        .load-more-container {
            display: flex;
            justify-content: center;
            margin-top: 15px;
        }

        .btn-load-more {
            background: #2b2b2b;
            color: #fff;
            border: 1px solid var(--border-color);
            padding: 10px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn-load-more:hover {
            background: #3a3a3a;
        }

        .status-msg {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--text-muted);
            padding: 30px;
            font-size: 0.95rem;
        }

        .genre-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
            width: 100%;
        }

        .genre-tag {
            padding: 6px 14px;
            background: rgba(0, 0, 0, 0.55);
            border: 1px solid var(--border-color);
            border-radius: 999px;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, color 0.2s, border-color 0.2s;
        }

        .genre-tag:hover {
            color: var(--text-color);
            border-color: rgba(255, 255, 255, 0.35);
        }

        .genre-tag.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        .genre-tag:focus {
            outline: none;
            border-color: #fff;
            box-shadow: 0 0 0 2px rgba(229, 9, 20, 0.45);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes heroFade {
            from { opacity: 0.55; }
            to { opacity: 1; }
        }

        @keyframes layoutFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes modalBackdropIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes modalContentIn {
            from {
                opacity: 0;
                transform: scale(0.96);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .main-layout {
            animation: layoutFadeIn 0.45s ease-out;
        }

        .hero-section.hero-animate .hero-poster,
        .hero-section.hero-animate .hero-details {
            animation: heroFade 0.35s ease-out;
        }

        .hero-poster {
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .card-item {
            animation: fadeInUp 0.4s ease-out both;
        }

        .card-item:hover:not(:focus) {
            transform: translateY(-3px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.45);
        }

        .btn-action,
        .btn-play-large {
            transition: transform 0.15s ease, background 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-action:active,
        .btn-play-large:active {
            transform: scale(0.97);
        }

        .btn-play-large:hover {
            box-shadow: 0 4px 18px rgba(229, 9, 20, 0.45);
        }

        .trailer-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }

        .trailer-modal.is-open {
            display: flex;
            animation: modalBackdropIn 0.25s ease-out;
        }

        .trailer-modal.is-open .trailer-modal-frame {
            animation: modalContentIn 0.3s ease-out;
        }

        .trailer-modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #fff;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: bold;
        }

        @media (prefers-reduced-motion: reduce) {
            .main-layout,
            .card-item,
            .hero-section.hero-animate .hero-poster,
            .hero-section.hero-animate .hero-details,
            .trailer-modal.is-open,
            .trailer-modal.is-open .trailer-modal-frame {
                animation: none;
            }

            .card-item:hover:not(:focus) {
                transform: none;
            }
        }
        @media (max-width: 600px) {
            .main-layout {
                padding: 12px;
                gap: 15px;
            }

            header {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }

            .logo-wrapper {
                justify-content: center;
            }

            .controls-bar {
                flex-direction: column;
                width: 100%;
            }

            .type-selector {
                width: 100%;
            }

            .type-btn {
                flex: 1;
                text-align: center;
            }

            .search-box {
                width: 100%;
            }

            .hero-section {
                flex-direction: column;
                text-align: center;
                padding: 16px;
            }

            .hero-poster {
                width: 110px;
                height: 165px;
            }

            .hero-details {
                align-items: center;
                width: 100%;
            }

            .hero-title {
                font-size: 1.3rem;
            }

            .hero-actions {
                width: 100%;
                flex-direction: column;
            }

            .btn-play-large {
                width: 100%;
            }

            .hero-actions .btn-trailer {
                width: 100%;
            }

            .episodes-selector {
                justify-content: center;
            }

            .results-grid {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
                gap: 8px;
            }

            .genre-bar {
                gap: 6px;
            }

            .genre-tag {
                padding: 5px 11px;
                font-size: 0.8rem;
            }

            .card-img {
                height: 145px;
            }
        }
    </style>
</head>
<body>

<!-- STRUTTURA PER LO SFONDO DINAMICO -->
<div id="backdropContainer">
    <img id="backdropImg" src="" alt="Backdrop">
</div>
<div class="backdrop-overlay"></div>

<div class="main-layout">
    <header>
        <div class="logo-wrapper">
            <img src="./logo.png" alt="Caponioflix" class="app-logo" id="logoImg" onerror="handleLogoError()">
            <span class="logo-fallback" id="logoText" style="display: none;">CAPONIOFLIX</span>
        </div>

        <div class="controls-bar">
            <div class="type-selector">
                <button class="type-btn active" id="btnMovie" onclick="setType('movie')" tabindex="0">Film</button>
                <button class="type-btn" id="btnTv" onclick="setType('tv')" tabindex="0">Serie TV</button>
            </div>
            
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Digita per cercare..." oninput="onInputSearch()" onkeydown="if(event.key === 'Enter') cercaImmediata()" tabindex="0" autocomplete="off">
                <button class="btn-action" type="button" onclick="cercaImmediata()" tabindex="0">Cerca</button>
            </div>
        </div>
    </header>

    <!-- SEZIONE HERO -->
    <div class="hero-section" id="heroSection">
        <img class="hero-poster" id="heroPoster" src="https://via.placeholder.com/185x278?text=Caricamento..." alt="Poster">
        <div class="hero-details">
            <div class="hero-title" id="heroTitle">Caricamento...</div>
            <div class="hero-meta" id="heroMeta">---</div>
            <div class="hero-overview" id="heroOverview">...</div>
            
            <div class="episodes-selector" id="episodesFrame">
                <label>Stagione: <input type="number" id="seasonInput" value="1" min="1" tabindex="0"></label>
                <label>Episodio: <input type="number" id="episodeInput" value="1" min="1" tabindex="0"></label>
            </div>

            <div class="hero-actions">
                <button class="btn-play-large" id="btnPlay" onclick="riproduciInPagina()" tabindex="0">
                    ▶ GUARDA ORA
                </button>
                <button class="btn-action btn-trailer" type="button" onclick="showTrailer()" tabindex="0">Trailer</button>
            </div>
        </div>
    </div>
<div class="section-title" id="recsTitle" style="display:none;">Potrebbe piacerti anche</div>
<div id="recsGrid" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(100px, 1fr)); gap:10px;"></div>
    <!-- LISTA RISULTATI / POPOLARI -->
    <div>
        <div class="section-title" id="gridTitle">Popolari del momento</div>
        <div class="genre-bar" id="genreBar" role="group" aria-label="Filtra per genere"></div>
        <div class="results-grid" id="resultsList">
            <div class="status-msg">Caricamento contenuti in corso...</div>
        </div>
        <div class="load-more-container">
            <button class="btn-load-more" id="btnLoadMore" onclick="caricaAltriRisultati()" style="display: none;" tabindex="0">
                ➕ CARICA ALTRI TITOLI
            </button>
        </div>
    </div>
</div>

<script>
    const API_KEY = "19a3e7d1a5356e8daa2323dabc5e1a2d";
    let currentType = 'movie';
    let risultatiRicerca = [];
    let elementoSelezionato = null;
    let currentPage = 1;
    let isSearchMode = false;
    let selectedGenreId = null;
    const SEARCH_DEBOUNCE_MS = 500;
    let debounceTimer;

    const GENRES_BY_TYPE = {
        movie: [
            { id: null, label: 'Tutti' },
            { id: 28, label: 'Azione' },
            { id: 35, label: 'Commedia' },
            { id: 27, label: 'Horror' },
            { id: 18, label: 'Dramma' },
            { id: 878, label: 'Fantascienza' },
            { id: 53, label: 'Thriller' },
            { id: 10749, label: 'Romantico' }
        ],
        tv: [
            { id: null, label: 'Tutti' },
            { id: 10759, label: 'Azione' },
            { id: 35, label: 'Commedia' },
            { id: 9648, label: 'Horror' },
            { id: 18, label: 'Dramma' },
            { id: 10765, label: 'Fantascienza' },
            { id: 80, label: 'Crime' },
            { id: 10751, label: 'Famiglia' }
        ]
    };

    function getGenreLabel(id) {
        if (id == null) return '';
        const list = GENRES_BY_TYPE[currentType] || [];
        return list.find(g => g.id === id)?.label || 'Genere';
    }

    function renderGenreTags() {
        const bar = document.getElementById('genreBar');
        bar.innerHTML = '';
        (GENRES_BY_TYPE[currentType] || []).forEach(genre => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'genre-tag' + (selectedGenreId === genre.id ? ' active' : '');
            btn.textContent = genre.label;
            btn.tabIndex = 0;
            btn.onclick = () => setGenreFilter(genre.id);
            bar.appendChild(btn);
        });
    }

    function setGenreFilter(genreId) {
        selectedGenreId = genreId;
        renderGenreTags();
        ricaricaLista(true);
    }

    function aggiornaTitoloGriglia() {
        const query = document.getElementById('searchInput').value.trim();
        const tipo = currentType === 'movie' ? 'Film' : 'Serie TV';
        if (query) {
            const genere = selectedGenreId ? ` · ${getGenreLabel(selectedGenreId)}` : '';
            document.getElementById('gridTitle').innerText = `Risultati per "${query}"${genere}`;
            return;
        }
        if (selectedGenreId) {
            document.getElementById('gridTitle').innerText = `${getGenreLabel(selectedGenreId)} · ${tipo}`;
            return;
        }
        document.getElementById('gridTitle').innerText = `Popolari del momento (${tipo})`;
    }

    function ricaricaLista(reset = true) {
        const query = document.getElementById('searchInput').value.trim();
        if (query) {
            cerca(reset);
        } else if (selectedGenreId) {
            caricaPerGenere(reset);
        } else {
            caricaPopolari(reset);
        }
    }

    function onInputSearch() {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => {
            cerca(true);
        }, SEARCH_DEBOUNCE_MS);
    }

    function cercaImmediata() {
        clearTimeout(debounceTimer);
        cerca(true);
    }
async function fetchRecommendations(id) {
    const grid = document.getElementById('recsGrid');
    const titleEl = document.getElementById('recsTitle');
    try {
        const res = await fetch(`https://api.themoviedb.org/3/${currentType}/${id}/recommendations?api_key=${API_KEY}&language=it-IT`);
        if (!res.ok) {
            titleEl.style.display = 'none';
            grid.innerHTML = '';
            return;
        }
        const data = await res.json();
        const results = (data.results || []).slice(0, 5);
        if (results.length === 0) {
            titleEl.style.display = 'none';
            grid.innerHTML = '';
            return;
        }
        titleEl.style.display = 'block';
        grid.innerHTML = '';
        results.forEach(item => {
            const posterPath = item.poster_path
                ? `https://image.tmdb.org/t/p/w200${item.poster_path}`
                : 'https://via.placeholder.com/185x278?text=No+Cover';
            const card = document.createElement('div');
            card.className = 'card-item rec-card';
            card.tabIndex = 0;
            const img = document.createElement('img');
            img.src = posterPath;
            img.alt = currentType === 'movie' ? (item.title || '') : (item.name || '');
            img.style.width = '100%';
            card.appendChild(img);
            card.onclick = () => selezionaItem(item);
            grid.appendChild(card);
        });
    } catch {
        titleEl.style.display = 'none';
        grid.innerHTML = '';
    }
}

    function selezionaItem(item) {
        let index = risultatiRicerca.findIndex(r => r.id === item.id);
        if (index === -1) {
            risultatiRicerca.push(item);
            index = risultatiRicerca.length - 1;
        }
        aggiornaHero(index);
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    window.onload = () => {
        renderGenreTags();
        caricaPopolari(true);
    };

    function handleLogoError() {
        document.getElementById('logoImg').style.display = 'none';
        document.getElementById('logoText').style.display = 'inline-block';
    }

    function setType(type) {
        currentType = type;
        document.getElementById('btnMovie').classList.toggle('active', type === 'movie');
        document.getElementById('btnTv').classList.toggle('active', type === 'tv');
        
        const frame = document.getElementById('episodesFrame');
        if (type === 'tv') {
            frame.classList.add('active');
        } else {
            frame.classList.remove('active');
        }

        selectedGenreId = null;
        renderGenreTags();

        const query = document.getElementById('searchInput').value.trim();
        if (!query) {
            caricaPopolari(true);
        } else {
            cerca(true);
        }
    }

    async function caricaPopolari(reset = false) {
        isSearchMode = false;
        if (reset) {
            currentPage = 1;
            risultatiRicerca = [];
            document.getElementById('resultsList').innerHTML = '<div class="status-msg">Caricamento in corso...</div>';
        }
        aggiornaTitoloGriglia();

        await fetchEPopola(`https://api.themoviedb.org/3/trending/${currentType}/week?api_key=${API_KEY}&language=it-IT&page=${currentPage}`, reset);
        currentPage++;
        await fetchEPopola(`https://api.themoviedb.org/3/trending/${currentType}/week?api_key=${API_KEY}&language=it-IT&page=${currentPage}`, false);

        document.getElementById('btnLoadMore').style.display = 'block';
    }

    async function caricaPerGenere(reset = false) {
        isSearchMode = false;
        if (reset) {
            currentPage = 1;
            risultatiRicerca = [];
            document.getElementById('resultsList').innerHTML = '<div class="status-msg">Caricamento in corso...</div>';
        }
        aggiornaTitoloGriglia();

        const discoverBase = `https://api.themoviedb.org/3/discover/${currentType}?api_key=${API_KEY}&language=it-IT&sort_by=popularity.desc&with_genres=${selectedGenreId}`;

        await fetchEPopola(`${discoverBase}&page=${currentPage}`, reset);
        currentPage++;
        await fetchEPopola(`${discoverBase}&page=${currentPage}`, false);

        document.getElementById('btnLoadMore').style.display = 'block';
    }

    async function cerca(reset = false) {
        const query = document.getElementById('searchInput').value.trim();

        if (!query) {
            ricaricaLista(true);
            return;
        }

        isSearchMode = true;
        if (reset) {
            currentPage = 1;
            risultatiRicerca = [];
            document.getElementById('resultsList').innerHTML = '<div class="status-msg">Ricerca in corso...</div>';
        }
        aggiornaTitoloGriglia();

        const baseUrl = `https://api.themoviedb.org/3/search/${currentType}?api_key=${API_KEY}&query=${encodeURIComponent(query)}&language=it-IT`;
        const genreFilter = selectedGenreId;

        await fetchEPopola(`${baseUrl}&page=${currentPage}`, reset, genreFilter);
        currentPage++;
        await fetchEPopola(`${baseUrl}&page=${currentPage}`, false, genreFilter);

        document.getElementById('btnLoadMore').style.display = 'block';
    }

    function caricaAltriRisultati() {
        currentPage++;
        const query = document.getElementById('searchInput').value.trim();
        if (isSearchMode && query) {
            const url = `https://api.themoviedb.org/3/search/${currentType}?api_key=${API_KEY}&query=${encodeURIComponent(query)}&language=it-IT&page=${currentPage}`;
            fetchEPopola(url, false, selectedGenreId);
        } else if (selectedGenreId) {
            const url = `https://api.themoviedb.org/3/discover/${currentType}?api_key=${API_KEY}&language=it-IT&sort_by=popularity.desc&with_genres=${selectedGenreId}&page=${currentPage}`;
            fetchEPopola(url, false);
        } else {
            const url = `https://api.themoviedb.org/3/trending/${currentType}/week?api_key=${API_KEY}&language=it-IT&page=${currentPage}`;
            fetchEPopola(url, false);
        }
    }

    async function fetchEPopola(url, resetGrid = false, genreFilter = null) {
        const listContainer = document.getElementById('resultsList');

        try {
            const response = await fetch(url);
            if (!response.ok) {
                throw new Error(`API ${response.status}`);
            }
            const data = await response.json();
            let results = data.results || [];

            if (genreFilter) {
                results = results.filter(item => (item.genre_ids || []).includes(genreFilter));
            }

            if (resetGrid) {
                listContainer.innerHTML = '';
            }

            if (results.length === 0 && risultatiRicerca.length === 0) {
                listContainer.innerHTML = '<div class="status-msg">Nessun contenuto trovato.</div>';
                document.getElementById('btnLoadMore').style.display = 'none';
                return;
            }

            const startIndex = risultatiRicerca.length;

            results.forEach((item) => {
                risultatiRicerca.push(item);
                const currentIndex = risultatiRicerca.length - 1;

                const nome = currentType === 'movie' ? item.title : item.name;
                const posterPath = item.poster_path 
                    ? `https://image.tmdb.org/t/p/w342${item.poster_path}`
                    : 'https://via.placeholder.com/185x278?text=No+Cover';

                const card = document.createElement('div');
                card.className = 'card-item';
                card.tabIndex = 0;

                const img = document.createElement('img');
                img.className = 'card-img';
                img.src = posterPath;
                img.alt = nome || '';

                const cardInfo = document.createElement('div');
                cardInfo.className = 'card-info';
                const titleEl = document.createElement('div');
                titleEl.className = 'card-title';
                titleEl.textContent = nome || '';

                cardInfo.appendChild(titleEl);
                card.appendChild(img);
                card.appendChild(cardInfo);

                card.onfocus = () => aggiornaHero(currentIndex);
                card.onclick = () => {
                    aggiornaHero(currentIndex);
                    document.getElementById('btnPlay').focus();
                };

                card.onkeydown = (e) => {
                    if (e.key === 'Enter' || e.keyCode === 13) {
                        aggiornaHero(currentIndex);
                        document.getElementById('btnPlay').focus();
                    }
                };

                const delayIndex = currentIndex - startIndex;
                if (delayIndex <= 14) {
                    card.style.animationDelay = `${delayIndex * 35}ms`;
                }

                listContainer.appendChild(card);
            });

            if (startIndex === 0 && risultatiRicerca.length > 0) {
                aggiornaHero(0);
            }

        } catch (err) {
            if (risultatiRicerca.length === 0) {
                listContainer.innerHTML = `<div class="status-msg">Errore di connessione: ${err.message}</div>`;
            }
        }
    }

    function aggiornaHero(index) {
        elementoSelezionato = risultatiRicerca[index];
        if (!elementoSelezionato) return;

        const heroSection = document.getElementById('heroSection');
        heroSection.classList.remove('hero-animate');
        void heroSection.offsetWidth;
        heroSection.classList.add('hero-animate');

        const selectedId = elementoSelezionato.id;
        document.querySelectorAll('#resultsList .card-item').forEach((el, i) => {
            el.classList.toggle('selected', risultatiRicerca[i]?.id === selectedId);
        });

        const item = elementoSelezionato;
        const nome = currentType === 'movie' ? item.title : item.name;
        const dataUscita = currentType === 'movie' ? item.release_date : item.first_air_date;
        const anno = dataUscita ? dataUscita.substring(0, 4) : 'N/D';
        const voto = item.vote_average ? `★ ${item.vote_average.toFixed(1)}/10` : '';

        document.getElementById('heroTitle').innerText = nome;
        document.getElementById('heroMeta').innerText = `${anno} • ${voto}`;
        document.getElementById('heroOverview').innerText = item.overview || 'Nessuna descrizione disponibile.';

        const posterPath = item.poster_path 
            ? `https://image.tmdb.org/t/p/w342${item.poster_path}`
            : 'https://via.placeholder.com/185x278?text=No+Cover';
        document.getElementById('heroPoster').src = posterPath;

        // CARICAMENTO SFONDO IN TAG <img>
        const backdropImg = document.getElementById('backdropImg');
        const bgPath = item.backdrop_path || item.poster_path;

        if (bgPath) {
            const imgUrl = `https://image.tmdb.org/t/p/w1280${bgPath}`;
            backdropImg.onload = () => {
                backdropImg.style.opacity = '1';
            };
            backdropImg.src = imgUrl;
        } else {
            backdropImg.style.opacity = '0';
        }

        fetchRecommendations(item.id);
    }

    function riproduciInPagina() {
        if (!elementoSelezionato) {
            alert("Seleziona prima un elemento!");
            return;
        }

        const tmdbId = elementoSelezionato.id;
        let url = "";

        if (currentType === 'movie') {
            url = `https://vixsrc.to/movie/${tmdbId}/`;
        } else {
            const season = document.getElementById('seasonInput').value || '1';
            const episode = document.getElementById('episodeInput').value || '1';
            url = `https://vixsrc.to/tv/${tmdbId}/${season}/${episode}/`;
        }

        window.open(url, '_blank');
    }
    async function showTrailer() {
        if (!elementoSelezionato) return alert("Seleziona prima un titolo");
        try {
            const res = await fetch(`https://api.themoviedb.org/3/${currentType}/${elementoSelezionato.id}/videos?api_key=${API_KEY}&language=it-IT`);
            if (!res.ok) {
                alert("Impossibile caricare il trailer.");
                return;
            }
            const data = await res.json();
            const trailer = (data.results || []).find(v => v.type === "Trailer" && v.site === "YouTube");
            if (trailer) {
                document.getElementById('trailerFrame').src = `https://www.youtube.com/embed/${trailer.key}`;
                document.getElementById('trailerModal').classList.add('is-open');
            } else {
                alert("Trailer non disponibile");
            }
        } catch {
            alert("Errore di connessione durante il caricamento del trailer.");
        }
    }

    function chiudiTrailerModal() {
        const modal = document.getElementById('trailerModal');
        modal.classList.remove('is-open');
        document.getElementById('trailerFrame').src = '';
    }
</script>
<div id="trailerModal" class="trailer-modal" role="dialog" aria-modal="true" aria-label="Anteprima trailer">
    <button type="button" class="trailer-modal-close" onclick="chiudiTrailerModal()">CHIUDI</button>
    <iframe id="trailerFrame" class="trailer-modal-frame" width="80%" height="80%" frameborder="0" allowfullscreen></iframe>
</div>
</body>
</html>
