<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caponioflix Premium</title>
    <style>
        /* --- STILI PREMIUM & ANIMAZIONI --- */
        :root {
            --bg-color: #141414;
            --card-bg: #1f1f1f;
            --accent: #e50914;
            --text-color: #ffffff;
        }

        body { background-color: var(--bg-color); color: var(--text-color); font-family: sans-serif; margin: 0; }

        /* Effetto Sfondo Dinamico */
        #backdropContainer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
        #backdropImg { width: 100%; height: 100%; object-fit: cover; filter: blur(15px) brightness(0.3); transition: opacity 0.8s ease-in-out; opacity: 0; }
        
        .container { padding: 20px; max-width: 1200px; margin: auto; }

        /* Animazione card */
        .card { 
            background: var(--card-bg); border-radius: 8px; cursor: pointer; 
            transition: transform 0.3s ease, box-shadow 0.3s ease; 
        }
        .card:hover { transform: scale(1.1); box-shadow: 0 10px 20px rgba(0,0,0,0.5); z-index: 10; }
        
        /* Layout Grid */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; margin-top: 20px; }
        
        button { cursor: pointer; padding: 10px 20px; background: var(--accent); color: white; border: none; border-radius: 4px; }
        input { padding: 10px; border-radius: 4px; border: none; }
    </style>
</head>
<body>

<div id="backdropContainer">
    <img id="backdropImg" src="">
</div>

<div class="container">
    <header style="display:flex; gap: 10px; margin-bottom: 20px;">
        <input type="text" id="searchInput" placeholder="Cerca film o serie...">
        <button onclick="cerca()">Cerca</button>
        <button onclick="changeType('movie')">Film</button>
        <button onclick="changeType('tv')">Serie TV</button>
    </header>

    <div id="hero" style="margin-bottom: 40px;">
        <h1 id="title">Benvenuto su Caponioflix</h1>
        <p id="overview"></p>
        <button onclick="riproduci()">▶ GUARDA ORA</button>
    </div>

    <div class="grid" id="results"></div>
</div>

<script>
    const API_KEY = "19a3e7d1a5356e8daa2323dabc5e1a2d";
    let currentType = 'movie';
    let currentItems = [];

    // Funzione principale di ricerca
    async function cerca() {
        const query = document.getElementById('searchInput').value;
        const url = query 
            ? `https://api.themoviedb.org/3/search/${currentType}?api_key=${API_KEY}&query=${query}&language=it-IT`
            : `https://api.themoviedb.org/3/trending/${currentType}/week?api_key=${API_KEY}&language=it-IT`;
        
        const res = await fetch(url);
        const data = await res.json();
        renderizza(data.results);
    }

    // Funzione per cambiare tipo (Film/TV)
    function changeType(type) {
        currentType = type;
        cerca();
    }

    // Rendering dei risultati
    function renderizza(items) {
        currentItems = items;
        const grid = document.getElementById('results');
        grid.innerHTML = '';
        
        items.forEach((item, index) => {
            if(!item.poster_path) return;
            const div = document.createElement('div');
            div.className = 'card';
            div.onclick = () => seleziona(index);
            div.innerHTML = `<img src="https://image.tmdb.org/t/p/w300${item.poster_path}" style="width:100%; border-radius:8px;">`;
            grid.appendChild(div);
        });
        if(items.length > 0) seleziona(0);
    }

    // Gestione selezione e sfondo
    function seleziona(index) {
        const item = currentItems[index];
        document.getElementById('title').innerText = item.title || item.name;
        document.getElementById('overview').innerText = item.overview;
        
        const img = document.getElementById('backdropImg');
        img.style.opacity = '0';
        setTimeout(() => {
            img.src = `https://image.tmdb.org/t/p/original${item.backdrop_path || item.poster_path}`;
            img.style.opacity = '1';
        }, 300);
    }

    // Riproduzione
    function riproduci() {
        if(currentItems.length === 0) return;
        const id = currentItems[0].id;
        const url = currentType === 'movie' 
            ? `https://vixsrc.to/movie/${id}/` 
            : `https://vixsrc.to/tv/${id}/1/1/`;
        window.open(url, '_blank');
    }

    // Avvio automatico
    cerca();
</script>

</body>
</html>
