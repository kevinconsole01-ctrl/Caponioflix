<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caponioflix</title>
    <style>
        :root {
            --bg-color: #0f0f11;
            --card-bg: #1a1a1e;
            --list-bg: #141417;
            --text-color: #f0f0f2;
            --text-muted: #a0a0aa;
            --accent-black: #27272a;
            --accent-hover: #3f3f46;
            --accent-border: #52525b;
            --accent-green: #22c55e;
            --accent-green-hover: #16a34a;
            --border-color: #27272a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background-color: var(--bg-color);
            border-radius: 12px;
            padding: 20px;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 15px;
        }

        .app-logo {
            max-width: 180px;
            height: auto;
            display: block;
            margin: 0 auto;
            border-radius: 8px;
        }

        h1 {
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #ffffff;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .type-selector {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 15px;
        }

        .type-selector label {
            cursor: pointer;
            font-weight: bold;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="text"], input[type="number"] {
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            padding: 10px 14px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus, input[type="number"]:focus {
            border-color: #ffffff;
        }

        .search-box input[type="text"] {
            flex-grow: 1;
        }

        button {
            background-color: #ffffff;
            color: #000000;
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:focus, .result-item:focus, input:focus, .type-selector label:focus-within {
            outline: 3px solid #ffffff;
            outline-offset: 2px;
        }

        button:hover {
            background-color: #e4e4e7;
        }

        .episodes-frame {
            display: none;
            background-color: var(--card-bg);
            padding: 12px;
            border-radius: 8px;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
        }

        .episodes-frame.active {
            display: flex;
        }

        .episodes-frame input {
            width: 60px;
            text-align: center;
        }

        .results-list {
            background-color: var(--list-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 15px;
        }

        .result-item {
            padding: 12px 15px;
            border-bottom: 1px solid var(--card-bg);
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .result-item:hover, .result-item.selected {
            background-color: var(--card-bg);
            color: #ffffff;
            font-weight: bold;
        }

        .btn-open {
            width: 100%;
            background-color: var(--accent-green);
            color: #ffffff;
            margin-bottom: 20px;
        }

        .btn-open:hover {
            background-color: var(--accent-green-hover);
        }

        .player-wrapper {
            display: none;
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 12px;
            background-color: #000000;
            border: 2px solid var(--border-color);
            margin-top: 10px;
        }

        .player-wrapper.active {
            display: block;
        }

        .player-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo-container">
        <img src="logo.png" alt="Logo Caponioflix" class="app-logo">
    </div>

    <h1>Caponioflix</h1>

    <div class="type-selector">
        <label>
            <input type="radio" name="searchType" value="movie" checked onchange="toggleType()"> Film
        </label>
        <label>
            <input type="radio" name="searchType" value="tv" onchange="toggleType()"> Serie TV
        </label>
    </div>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Cerca film o serie TV..." onkeydown="if(event.key === 'Enter') cerca()">
        <button onclick="cerca()" tabindex="0">Cerca</button>
    </div>

    <div class="episodes-frame" id="episodesFrame">
        <label>Stagione: <input type="number" id="seasonInput" value="1" min="1" onchange="aggiornaVideoSeAttivo()"></label>
        <label>Episodio: <input type="number" id="episodeInput" value="1" min="1" onchange="aggiornaVideoSeAttivo()"></label>
    </div>

    <div class="results-list" id="resultsList">
        <div class="result-item" style="color: var(--text-muted); cursor: default;">Effettua una ricerca...</div>
    </div>

    <button class="btn-open" onclick="riproduciInPagina()" tabindex="0">▶ Guarda Nella Stessa Pagina</button>

    <div class="player-wrapper" id="playerWrapper">
        <iframe id="videoPlayer" allowfullscreen scrolling="no"></iframe>
    </div>
</div>

<script>
    const API_KEY = "19a3e7d1a5356e8daa2323dabc5e1a2d";

    let risultatiRicerca = [];
    let elementoSelezionato = null;

    function toggleType() {
        const type = document.querySelector('input[name="searchType"]:checked').value;
        const frame = document.getElementById('episodesFrame');
        if (type === 'tv') {
            frame.classList.add('active');
        } else {
            frame.classList.remove('active');
        }
    }

    async function cerca() {
        const query = document.getElementById('searchInput').value.trim();
        const type = document.querySelector('input[name="searchType"]:checked').value;
        const listContainer = document.getElementById('resultsList');

        if (!query) return;

        listContainer.innerHTML = '<div class="result-item">Ricerca in corso...</div>';
        risultatiRicerca = [];
        elementoSelezionato = null;

        const url = `https://api.themoviedb.org/3/search/${type}?api_key=${API_KEY}&query=${encodeURIComponent(query)}&language=it-IT`;

        try {
            const response = await fetch(url);
            const data = await response.json();
            const results = data.results || [];

            listContainer.innerHTML = '';

            if (results.length === 0) {
                listContainer.innerHTML = '<div class="result-item">Nessun risultato trovato.</div>';
                return;
            }

            results.slice(0, 15).forEach((item, index) => {
                risultatiRicerca.push(item);

                const nome = type === 'movie' ? item.title : item.name;
                const dataUscita = type === 'movie' ? item.release_date : item.first_air_date;
                const anno = dataUscita ? ` (${dataUscita.substring(0, 4)})` : '';

                const div = document.createElement('div');
                div.className = 'result-item';
                div.tabIndex = 0;
                div.innerText = `${nome}${anno}`;
                
                div.onclick = () => {
                    selezionaVoce(div, index);
                    riproduciInPagina();
                };
                div.onkeydown = (e) => {
                    if (e.key === 'Enter') {
                        selezionaVoce(div, index);
                        riproduciInPagina();
                    }
                };

                listContainer.appendChild(div);
            });

        } catch (err) {
            listContainer.innerHTML = `<div class="result-item">Errore: ${err.message}</div>`;
        }
    }

    function selezionaVoce(element, index) {
        document.querySelectorAll('.result-item').forEach(el => el.classList.remove('selected'));
        element.classList.add('selected');
        elementoSelezionato = risultatiRicerca[index];
    }

    function riproduciInPagina() {
        if (!elementoSelezionato) {
            alert("Seleziona prima un elemento dalla lista!");
            return;
        }

        const type = document.querySelector('input[name="searchType"]:checked').value;
        const tmdbId = elementoSelezionato.id;
        let url = "";

        if (type === 'movie') {
            url = `https://vixsrc.to/movie/${tmdbId}/`;
        } else {
            const season = document.getElementById('seasonInput').value || '1';
            const episode = document.getElementById('episodeInput').value || '1';
            url = `https://vixsrc.to/tv/${tmdbId}/${season}/${episode}/`;
        }

        const wrapper = document.getElementById('playerWrapper');
        const iframe = document.getElementById('videoPlayer');

        iframe.src = url;
        wrapper.classList.add('active');

        wrapper.scrollIntoView({ behavior: 'smooth' });
    }

    function aggiornaVideoSeAttivo() {
        const wrapper = document.getElementById('playerWrapper');
        if (wrapper.classList.contains('active') && elementoSelezionato) {
            riproduciInPagina();
        }
    }
</script>

</body>
</html>
