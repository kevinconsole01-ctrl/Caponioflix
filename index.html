<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Caponioflix Premium</title>
    <link rel="icon" type="image/png" href="Nuovo progetto (1).png">

    <!-- PWA: consente di aprire il sito come app a schermo intero (senza barra indirizzi) una volta aggiunto alla home -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#181818">

    <!-- iOS (Safari) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Caponioflix">
    <link rel="apple-touch-icon" href="Nuovo progetto (1).png">

    <!-- Android (Chrome) -->
    <meta name="mobile-web-app-capable" content="yes">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #181818;
            --card-bg: #1f1f1f;
            --accent: #e50914; /* Rosso stile Netflix */
            --text-color: #ffffff;
            --text-muted: #aaaaaa;
            --border-color: #333333;

            /* Sistema di animazione */
            --ease-standard: cubic-bezier(0.4, 0, 0.2, 1);
            --ease-out-smooth: cubic-bezier(0.16, 1, 0.3, 1);
            --ease-out-soft: cubic-bezier(0.22, 1, 0.36, 1);
            --dur-fast: 150ms;
            --dur-base: 240ms;
            --dur-slow: 380ms;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.25) transparent;
        }

        *::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        *::-webkit-scrollbar-track {
            background: transparent;
        }

        *::-webkit-scrollbar-thumb {
            background-color: rgba(255, 255, 255, 0.18);
            border-radius: 999px;
            border: 2px solid transparent;
            background-clip: padding-box;
            transition: background-color var(--dur-base) var(--ease-standard);
        }

        *::-webkit-scrollbar-thumb:hover {
            background-color: rgba(229, 9, 20, 0.55);
        }

        *::-webkit-scrollbar-corner {
            background: transparent;
        }

        html, body {
            width: 100%;
            max-width: 100%;
            overflow: hidden;
            color: var(--text-color);
            min-height: 100vh;
            height: 100vh;
            position: relative;
        }

        html, body {
            background-color: var(--bg-color);
        }

        .main-layout {
            background-color: transparent;
        }

        #splashScreen {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--bg-color, #141414);
            transition: opacity 0.5s ease-out;
        }

        #splashScreen.is-hidden {
            opacity: 0;
            pointer-events: none;
        }

        #splashScreen .splash-logo {
            max-width: 220px;
            width: 60vw;
            height: auto;
            object-fit: contain;
            animation: splashPulse 1.6s ease-in-out infinite;
        }

        #splashScreen .splash-logo-fallback {
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--accent);
            letter-spacing: 1px;
            text-transform: uppercase;
            animation: splashPulse 1.6s ease-in-out infinite;
        }

        @keyframes splashPulse {
            0%, 100% { opacity: 0.55; transform: scale(0.96); }
            50% { opacity: 1; transform: scale(1.04); }
        }

        .main-layout {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: relative;
            z-index: 1;
            height: 100vh;
            overflow: hidden;
        }

        .page-shell {
            display: grid;
            grid-template-columns: 280px minmax(0, 1fr);
            gap: 20px;
            align-items: stretch;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }

        .content-stack {
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-width: 0;
            height: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            padding-right: 4px;
            scrollbar-gutter: stable;
        }

        .sidebar {
            background: rgba(20, 20, 20, 0.72);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            padding: 16px;
            position: static;
            height: 100%;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .sidebar-title {
            font-size: 0.95rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
        }

        .sidebar-close,
        .sidebar-toggle {
            display: none;
            border: 1px solid rgba(255, 255, 255, 0.16);
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }

        .sidebar-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .sidebar-section-title {
            font-size: 0.86rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .sidebar-overlay {
            display: none;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            width: 100%;
            flex-shrink: 0;
        }

        .logo-wrapper {
            display: flex;
            align-items: center;
        }

        .logo-link {
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .app-logo {
            max-height: 40px;
            width: auto;
            max-width: 160px;
            object-fit: contain;
        }

        .logo-fallback {
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--accent);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .controls-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .sidebar-toggle {
            display: none;
        }

        .type-selector {
            display: inline-flex;
            width: fit-content;
            max-width: 100%;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 999px;
            padding: 3px;
            border: 1px solid var(--border-color);
        }

        .type-btn {
            padding: 8px 14px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            border-radius: 999px;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .type-btn.active {
            background: var(--accent);
            color: #fff;
        }

        .search-box {
            display: flex;
            gap: 8px;
            flex-grow: 1;
        }

        .search-box input[type="text"] {
            border-radius: 999px;
        }

        .btn-random {
            background: rgba(229, 9, 20, 0.14);
            color: #fff;
            border: 1px solid rgba(229, 9, 20, 0.55);
            border-radius: 999px;
            padding: 10px 16px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 7px;
        }

        .btn-random:hover {
            background: var(--accent);
            border-color: var(--accent);
        }

        .btn-random:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .btn-random .dice-icon {
            display: inline-block;
            font-size: 1rem;
            line-height: 1;
        }

        .btn-random.is-loading .dice-icon {
            animation: diceSpin 0.6s linear infinite;
        }

        @keyframes diceSpin {
            to { transform: rotate(360deg); }
        }

        input[type="text"], input[type="number"] {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            padding: 10px 12px;
            font-size: 0.95rem;
            outline: none;
            width: 100%;
        }

        input[type="text"] { 
            flex-grow: 1; 
            min-width: 0;
        }

        .btn-action {
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 999px;
            padding: 10px 18px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .hero-section {
            display: grid;
            grid-template-columns: minmax(0, 1.2fr) minmax(280px, 0.8fr);
            gap: 24px;
            background: rgba(20, 20, 20, 0.65);
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            width: 100%;
            align-items: start;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        @media (max-width: 900px) {
            .hero-section {
                grid-template-columns: 1fr;
            }
        }

        .hero-poster {
            width: 180px;
            height: 270px;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.8);
            flex-shrink: 0;
        }

        .hero-details {
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-width: 0;
        }

        .hero-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            margin-top: 5px;
        }

        .btn-trailer {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.04);
            border-radius: 999px;
        }

        .btn-favorite {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 999px;
            width: 46px;
            height: 46px;
            font-size: 1.15rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        .btn-favorite.active {
            background: #fff;
            color: var(--accent);
            border-color: #fff;
        }

        .view-btn {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 999px;
            padding: 10px 16px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .view-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .view-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        .favorites-section {
            display: none;
            flex-direction: column;
            gap: 10px;
            padding: 4px 0;
        }

        .favorites-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
            align-items: start;
        }

        .favorite-card .card-img {
            height: 175px;
        }

        .favorite-card .card-info {
            min-height: 44px;
        }

        .favorite-card {
            position: relative;
            min-height: 100%;
        }

        .favorite-remove {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: none;
            background: rgba(0, 0, 0, 0.72);
            color: #fff;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            z-index: 2;
        }

        .favorites-empty {
            color: var(--text-muted);
            border: 1px dashed rgba(255, 255, 255, 0.18);
            border-radius: 12px;
            padding: 24px;
            text-align: center;
        }

        .btn-trailer:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .hero-title {
            font-size: 1.6rem;
            font-weight: 400;
            word-wrap: break-word;
            font-family: 'Bebas Neue', sans-serif;
            letter-spacing: 0.02em;
        }

        .hero-meta {
            display: flex;
            gap: 12px;
            align-items: center;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .hero-overview {
            font-size: 0.95rem;
            color: #ccc;
            line-height: 1.6;
            max-height: 180px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 6;
            -webkit-box-orient: vertical;
        }

        .episodes-selector {
            display: none;
            gap: 10px;
            align-items: center;
            margin-top: 5px;
            flex-wrap: wrap;
        }

        .episodes-selector.active {
            display: flex;
        }

        .episodes-selector select {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            padding: 8px 10px;
            font-size: 0.9rem;
            outline: none;
            min-width: 90px;
        }

        .section-title {
            font-size: 1.1rem;
            margin-bottom: 12px;
            font-weight: 400;
            font-family: 'Bebas Neue', sans-serif;
            letter-spacing: 0.03em;
        }

        .section-block {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
            padding: 4px;
            width: 100%;
            align-items: start;
        }

        .rec-card {
            /* transform inherited from .card-item */
        }

        #recsGrid {
            max-height: 2000px;
            transition: max-height var(--dur-slow) var(--ease-out-smooth),
                        opacity var(--dur-base) var(--ease-standard),
                        margin-top var(--dur-base) var(--ease-standard);
        }

        .card-item {
            background: var(--card-bg);
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
            position: relative;
            overflow: hidden;
            will-change: transform;
            transition: transform 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94), 
                        border-color 0.25s ease,
                        box-shadow 0.25s ease,
                        z-index 0s;
        }

        .card-item .card-img {
            border-radius: 6px 6px 0 0;
            overflow: hidden;
        }

        .card-img {
            width: 100%;
            height: 175px;
            aspect-ratio: auto;
            object-fit: cover;
            display: block;
        }

        .card-info {
            padding: 8px;
        }

        .card-title {
            font-size: 0.8rem;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        button:focus, 
        input:focus, 
        .card-item:focus {
            outline: none !important;
            border-color: #ffffff !important;
            transform: scale(1.05);
            z-index: 10;
            box-shadow: 0 8px 20px rgba(229, 9, 20, 0.5);
        }

        .card-item.selected {
            border-color: var(--accent);
        }

        .btn-play-large {
            background: var(--accent);
            color: #fff;
            padding: 0;
            width: 46px;
            height: 46px;
            font-size: 1.05rem;
            font-weight: bold;
            border: none;
            border-radius: 999px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0;
            margin-top: 5px;
            box-shadow: 0 6px 18px rgba(229, 9, 20, 0.28);
        }

        .load-more-container {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }

        .btn-load-more {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: #fff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 0;
            transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-load-more svg {
            width: 22px;
            height: 22px;
        }

        .btn-load-more:hover {
            background: rgba(255, 255, 255, 0.16);
            border-color: var(--accent);
            box-shadow: 0 6px 18px rgba(229, 9, 20, 0.35);
            transform: scale(1.08);
        }

        .btn-load-more:active {
            transform: scale(0.94);
        }

        .status-msg {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--text-muted);
            padding: 30px;
            font-size: 0.95rem;
        }

        .genre-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            width: 100%;
        }

        .genre-tag {
            padding: 6px 14px;
            background: rgba(0, 0, 0, 0.55);
            border: 1px solid var(--border-color);
            border-radius: 999px;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, color 0.2s, border-color 0.2s;
        }

        .genre-tag:hover {
            color: var(--text-color);
            border-color: rgba(255, 255, 255, 0.35);
        }

        .genre-tag.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        .genre-tag:focus {
            outline: none;
            border-color: #fff;
            box-shadow: 0 0 0 2px rgba(229, 9, 20, 0.45);
        }

        .provider-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .provider-tag .provider-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .filter-reset-btn {
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-muted);
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, color 0.2s, border-color 0.2s;
            width: 100%;
        }

        .filter-reset-btn:hover {
            color: var(--text-color);
            border-color: rgba(255, 255, 255, 0.35);
            background: rgba(255, 255, 255, 0.1);
        }

        .year-range-values {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-color);
            margin-top: 8px;
            margin-bottom: 4px;
            font-variant-numeric: tabular-nums;
        }

        .year-range-values span:nth-child(2) {
            color: var(--text-muted);
            font-weight: 400;
        }

        .year-slider {
            position: relative;
            height: 30px;
            display: flex;
            align-items: center;
        }

        .year-slider-track {
            position: absolute;
            left: 0;
            right: 0;
            height: 4px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.14);
        }

        .year-slider-range {
            position: absolute;
            height: 4px;
            border-radius: 999px;
            background: var(--accent);
        }

        .year-slider input[type="range"] {
            position: absolute;
            left: 0;
            width: 100%;
            height: 30px;
            margin: 0;
            background: transparent;
            -webkit-appearance: none;
            appearance: none;
            pointer-events: none;
        }

        .year-slider input[type="range"]::-webkit-slider-runnable-track {
            background: transparent;
            height: 30px;
        }

        .year-slider input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            pointer-events: auto;
            width: 16px;
            height: 16px;
            margin-top: 0;
            border-radius: 50%;
            background: #ffffff;
            border: 3px solid var(--accent);
            cursor: pointer;
            transform: translateY(7px);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
        }

        .year-slider input[type="range"]::-moz-range-track {
            background: transparent;
            height: 4px;
        }

        .year-slider input[type="range"]::-moz-range-thumb {
            pointer-events: auto;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #ffffff;
            border: 3px solid var(--accent);
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
        }

        .year-slider input[type="range"]:focus {
            outline: none;
        }

        .year-slider input[type="range"]:focus::-webkit-slider-thumb {
            box-shadow: 0 0 0 3px rgba(229, 9, 20, 0.45);
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes heroFade {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes layoutFadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes modalBackdropIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes modalContentIn {
            from {
                opacity: 0;
                transform: translateY(14px) scale(0.97);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes cardEnter {
            from {
                opacity: 0;
                transform: translateY(14px);
            }
            to {
                opacity: 1;
                transform: translateY(0);

        if (!item) return false;
        const key = getFavoriteKey(item);
        return favorites.some(entry => getFavoriteKey(entry) === key);

        btn.setAttribute('aria-pressed', String(active));
        btn.setAttribute('aria-label', active ? 'Rimuovi dai preferiti' : 'Aggiungi ai preferiti');
    }

    function toggleFavorite(item) {
        if (!item) return;
        const key = getFavoriteKey(item);
        const exists = favorites.some(entry => getFavoriteKey(entry) === key);

        if (exists) {
            favorites = favorites.filter(entry => getFavoriteKey(entry) !== key);
        } else {
            favorites.push({
                id: item.id,
                type: item.type || currentType,
                title: item.title || item.name || '',
                name: item.name || item.title || '',
                poster_path: item.poster_path || '',

        try {
            const url = `https://api.themoviedb.org/3/discover/${currentType}?api_key=${API_KEY}&language=it-IT&sort_by=popularity.desc&with_watch_providers=${providerId}&watch_region=IT&vote_count.gte=10&page=1`;

    function updateYearSliderUI() {
        const minInput = document.getElementById('yearMinInput');
        const maxInput = document.getElementById('yearMaxInput');
        const rangeEl = document.getElementById('yearSliderRange');
        if (!minInput || !maxInput || !rangeEl) return;
        document.getElementById('yearMinLabel').textContent = minInput.value;
        document.getElementById('yearMaxLabel').textContent = maxInput.value;
        const span = YEAR_MAX - YEAR_MIN;
        const minPct = ((minInput.value - YEAR_MIN) / span) * 100;
        const maxPct = ((maxInput.value - YEAR_MIN) / span) * 100;
        rangeEl.style.left = minPct + '%';
        rangeEl.style.width = Math.max(0, maxPct - minPct) + '%';
    }

    function initYearSlider() {
        const minInput = document.getElementById('yearMinInput');
        const maxInput = document.getElementById('yearMaxInput');
        if (!minInput || !maxInput) return;
        minInput.min = YEAR_MIN; minInput.max = YEAR_MAX; minInput.value = YEAR_MIN;
        maxInput.min = YEAR_MIN; maxInput.max = YEAR_MAX; maxInput.value = YEAR_MAX;
        updateYearSliderUI();

        minInput.addEventListener('input', () => {
            if (parseInt(minInput.value, 10) > parseInt(maxInput.value, 10) - 1) {
                minInput.value = parseInt(maxInput.value, 10) - 1;
            }
            selectedYearMin = parseInt(minInput.value, 10);
            updateYearSliderUI();
        });
        maxInput.addEventListener('input', () => {
            if (parseInt(maxInput.value, 10) < parseInt(minInput.value, 10) + 1) {
                maxInput.value = parseInt(minInput.value, 10) + 1;
            }
            selectedYearMax = parseInt(maxInput.value, 10);
            updateYearSliderUI();
        });
        minInput.addEventListener('change', () => ricaricaLista(true));
        maxInput.addEventListener('change', () => ricaricaLista(true));
    }

    async function estraiTitoloCasualeDaDiscover(extraParams = '') {
        const baseUrl = `https://api.themoviedb.org/3/discover/${currentType}?api_key=${API_KEY}&language=it-IT&sort_by=popularity.desc&vote_count.gte=25${extraParams}`;

        // Prima chiamata per scoprire quante pagine ha il catalogo con questi filtri
        const primaRes = await fetch(`${baseUrl}&page=1`);
        if (!primaRes.ok) throw new Error('API discover non disponibile');
        const primaData = await primaRes.json();
        const totalPages = Math.min(primaData.total_pages || 1, 500); // limite massimo TMDB

        if (!totalPages || totalPages < 1) return null;

        const paginaCasuale = Math.max(1, Math.floor(Math.random() * totalPages) + 1);

        let results;
        if (paginaCasuale === 1) {
            results = primaData.results || [];
        } else {
            const res = await fetch(`${baseUrl}&page=${paginaCasuale}`);
            if (!res.ok) throw new Error('API discover non disponibile');
            const data = await res.json();
            results = data.results || [];
        }

        if (!results.length) return null;
        return results[Math.floor(Math.random() * results.length)];
    }

    async function apriTitoloRandom() {
        setRandomButtonLoading(true);
        try {
            let item = null;

            if (currentView === 'favorites') {
                // Nei preferiti peschiamo dalla lista personale dell'utente
                const candidati = favorites.filter(f => (f.type || currentType) === currentType);
                const pool = candidati.length ? candidati : favorites;
                if (!pool.length) {
                    alert('Non hai ancora titoli nei preferiti per questo tipo.');
                    return;
                }
                item = pool[Math.floor(Math.random() * pool.length)];
            } else if (currentView === 'platforms') {
                // In Top 10 restiamo sulla piattaforma selezionata, ma peschiamo da tutto il suo catalogo IT
                item = await estraiTitoloCasualeDaDiscover(`&with_watch_providers=${currentPlatformId}&watch_region=IT&with_watch_monetization_types=flatrate`);
            } else {
                // Home: rispetta i filtri attivi in sidebar (genere, servizio, anno) su tutto il catalogo
                let params = '';
                if (selectedGenreId) params += `&with_genres=${selectedGenreId}`;
                if (selectedProviderId) params += `&with_watch_providers=${selectedProviderId}&watch_region=IT&with_watch_monetization_types=flatrate`;
                if (selectedYearMin !== YEAR_MIN || selectedYearMax !== YEAR_MAX) {
                    const campo = currentType === 'movie' ? 'primary_release_date' : 'first_air_date';
                    params += `&${campo}.gte=${selectedYearMin}-01-01&${campo}.lte=${selectedYearMax}-12-31`;
                }
                item = await estraiTitoloCasualeDaDiscover(params);
            }

            if (!item) {
                alert('Nessun titolo trovato per questa combinazione di filtri.');
                return;
            }

            apriItemFresco({ ...item, type: item.type || currentType });
        } catch (err) {
            alert('Impossibile trovare un titolo casuale in questo momento.');
        } finally {
            setRandomButtonLoading(false);
        }
    }

async function fetchRecommendations(id, mediaType = currentType) {
    const grid = document.getElementById('recsGrid');
    const headerEl = document.getElementById('recsHeader');
    try {
        const res = await fetch(`https://api.themoviedb.org/3/${mediaType}/${id}/recommendations?api_key=${API_KEY}&language=it-IT`);
        if (!res.ok) {
            headerEl.style.display = 'none';
            grid.innerHTML = '';
            return;
        }
        const data = await res.json();
        const results = (data.results || []).slice(0, 8);
        if (results.length === 0) {
            headerEl.style.display = 'none';
            grid.innerHTML = '';
            return;
        }
        headerEl.style.display = 'flex';
        grid.innerHTML = '';
        results.forEach(item => {
            const posterPath = item.poster_path
                ? `https://image.tmdb.org/t/p/w200${item.poster_path}`
                : 'https://via.placeholder.com/185x278?text=No+Cover';
            const card = document.createElement('div');
            card.className = 'card-item rec-card';
            card.tabIndex = 0;
            const img = document.createElement('img');
            img.src = posterPath;
            img.alt = mediaType === 'movie' ? (item.title || '') : (item.name || '');
            img.style.width = '100%';
            img.style.height = '135px';
            img.style.objectFit = 'cover';
            card.appendChild(img);
            card.onclick = () => selezionaItem(item);
            grid.appendChild(card);
        });
        setRecsCollapsed(window.innerWidth <= 600);
    } catch {
        headerEl.style.display = 'none';
        grid.innerHTML = '';
    }

            closeBtn.classList.add('is-back');
            closeBtn.setAttribute('aria-label', 'Torna al titolo precedente');
        } else {
            closeBtn.innerHTML = '✕';
            closeBtn.classList.remove('is-back');
            closeBtn.setAttribute('aria-label', 'Chiudi');

    }

    async function cercaConPersone(query, page = 1) {
        const yearMatch = query.match(/\b(19|20)\d{2}\b/);
        const year = yearMatch ? yearMatch[0] : null;
        const titleUrl = `https://api.themoviedb.org/3/search/${currentType}?api_key=${API_KEY}&query=${encodeURIComponent(query)}&language=it-IT&page=${page}`;
        const peopleUrl = `https://api.themoviedb.org/3/search/person?api_key=${API_KEY}&query=${encodeURIComponent(query)}&language=it-IT&page=${page}`;
        const yearUrl = year
            ? `https://api.themoviedb.org/3/discover/${currentType}?api_key=${API_KEY}&language=it-IT&sort_by=popularity.desc&page=${page}&${currentType === 'movie' ? 'primary_release_year' : 'first_air_date_year'}=${year}`
            : null;

        const requests = [fetch(titleUrl), fetch(peopleUrl)];
        if (yearUrl) requests.push(fetch(yearUrl));

        const [titleRes, peopleRes, yearRes] = await Promise.all(requests);

        const titleData = titleRes.ok ? await titleRes.json() : { results: [] };
        const peopleData = peopleRes.ok ? await peopleRes.json() : { results: [] };
        const yearData = yearRes?.ok ? await yearRes.json() : { results: [] };

        const combinedResults = [...(titleData.results || [])];
        const seen = new Set(combinedResults.map(item => `${item.id}-${currentType}`));

        const relevantPeople = (peopleData.results || []).filter(person =>
            person && ['Acting', 'Directing'].includes(person.known_for_department)
        ).slice(0, 6);

        const creditsResponses = await Promise.all(relevantPeople.map(async (person) => {
            const creditsUrl = `https://api.themoviedb.org/3/person/${person.id}/${currentType === 'movie' ? 'movie' : 'tv'}_credits?api_key=${API_KEY}&language=it-IT`;
            const creditsRes = await fetch(creditsUrl);
            if (!creditsRes.ok) return [];
            const creditsData = await creditsRes.json();
            const creditItems = [...(creditsData.cast || []), ...(creditsData.crew || [])];
            return creditItems.filter(item => item && item.id && (item.title || item.name));
        }));

        creditsResponses.flat().forEach((item) => {
            const key = `${item.id}-${currentType}`;
            if (!seen.has(key)) {
                seen.add(key);
                combinedResults.push(item);
            }
        });

        (yearData.results || []).forEach((item) => {
            const key = `${item.id}-${currentType}`;
            if (!seen.has(key)) {
                seen.add(key);
                combinedResults.push(item);
            }
        });

        return combinedResults;
    }

    async function fetchEPopola(input, resetGrid = false, genreFilter = null) {
        const listContainer = document.getElementById('resultsList');

        try {
            let results = [];

            if (Array.isArray(input)) {
                results = input;
            } else {
                const response = await fetch(input);
                if (!response.ok) {
                    throw new Error(`API ${response.status}`);
                }
                const data = await response.json();
                results = data.results || [];
            }

            if (genreFilter) {
                results = results.filter(item => (item.genre_ids || []).includes(genreFilter));
            }

            if (resetGrid) {
                listContainer.innerHTML = '';
            }

            if (results.length === 0 && risultatiRicerca.length === 0) {
                listContainer.innerHTML = '<div class="status-msg">Nessun contenuto trovato.</div>';
                document.getElementById('btnLoadMore').style.display = 'none';
                return;
            }

            const startIndex = risultatiRicerca.length;

            results.forEach((item) => {
                risultatiRicerca.push(item);
                const currentIndex = risultatiRicerca.length - 1;

                const nome = currentType === 'movie' ? item.title : item.name;
                const posterPath = item.poster_path 
                    ? `https://image.tmdb.org/t/p/w342${item.poster_path}`
                    : 'https://via.placeholder.com/185x278?text=No+Cover';

                const card = creaCard({
                    poster_path: item.poster_path,
                    title: item.title,
                    name: item.name
                });
                card.tabIndex = 0;

                const titleEl = card.querySelector('.card-title');
                titleEl.textContent = nome || '';

                card.onclick = () => {
                    aggiornaHero(currentIndex);
                    document.getElementById('btnPlay').focus();
                };

                card.onkeydown = (e) => {
                    if (e.key === 'Enter' || e.keyCode === 13) {
                        aggiornaHero(currentIndex);
                        document.getElementById('btnPlay').focus();
                    }
                };

                const delayIndex = currentIndex - startIndex;
                if (delayIndex <= 14) {
                    card.style.animationDelay = `${delayIndex * 35}ms`;
                }

                listContainer.appendChild(card);
            });

        } catch (err) {
            if (risultatiRicerca.length === 0) {
                listContainer.innerHTML = `<div class="status-msg">Errore di connessione: ${err.message}</div>`;
            }
        }
    }

    async function aggiornaSelectSerie(tvItem) {
        const seasonSelect = document.getElementById('seasonInput');
        const episodeSelect = document.getElementById('episodeInput');

        if (!tvItem || currentType !== 'tv') {
            seasonSelect.innerHTML = '';
            episodeSelect.innerHTML = '';
            return;
        }

        let seasonsData = Array.isArray(tvItem.seasons) ? tvItem.seasons : [];

        if (!seasonsData.length) {
            try {
                const res = await fetch(`https://api.themoviedb.org/3/tv/${tvItem.id}?api_key=${API_KEY}&language=it-IT`);
                if (res.ok) {
                    const detail = await res.json();
                    seasonsData = Array.isArray(detail.seasons) ? detail.seasons : [];
                }
            } catch {
                seasonsData = [];
            }
        }

        const seasonCount = Math.max(1, seasonsData.length || tvItem.number_of_seasons || 1);
        const seasonOptions = [];
        for (let s = 1; s <= seasonCount; s++) {
            const seasonInfo = seasonsData.find(entry => entry.season_number === s);
            const epCount = seasonInfo?.episode_count || 1;
            seasonOptions.push(`<option value="${s}">${s}${epCount ? ` (${epCount} ep)` : ''}</option>`);
        }
        seasonSelect.innerHTML = seasonOptions.join('');
        seasonSelect.value = '1';

        const aggiornaEpisodi = async (selectedSeason) => {
            const seasonInfo = seasonsData.find(entry => entry.season_number === selectedSeason);
            const fallbackCount = Math.max(1, seasonInfo?.episode_count || 1);

            episodeSelect.innerHTML = `<option value="1">Caricamento...</option>`;

            let episodesData = [];
            try {
                const res = await fetch(`https://api.themoviedb.org/3/tv/${tvItem.id}/season/${selectedSeason}?api_key=${API_KEY}&language=it-IT`);
                if (res.ok) {
                    const seasonDetail = await res.json();
                    episodesData = Array.isArray(seasonDetail.episodes) ? seasonDetail.episodes : [];
                }
            } catch {
                episodesData = [];
            }

            const episodeCount = Math.max(1, episodesData.length || fallbackCount);
            const episodeOptions = [];
            for (let e = 1; e <= episodeCount; e++) {
                const episodeInfo = episodesData.find(entry => entry.episode_number === e);
                const durata = episodeInfo?.runtime ? ` · ${formatRuntime(episodeInfo.runtime)}` : '';
                episodeOptions.push(`<option value="${e}">${e}${durata}</option>`);
            }
            episodeSelect.innerHTML = episodeOptions.join('');
            episodeSelect.value = '1';
        };

        seasonSelect.onchange = () => {
            aggiornaEpisodi(parseInt(seasonSelect.value || '1', 10));
        };

        await aggiornaEpisodi(1);
    }

    function formatRuntime(minutes) {
        if (!minutes) return '';
        const hours = Math.floor(minutes / 60);
        const mins = minutes % 60;
        return hours ? `${hours}h ${mins}m` : `${mins}m`;
    }

    function formatCountries(countries) {
        if (!Array.isArray(countries) || !countries.length) return '';
        let regionNames = null;
        try {
            regionNames = new Intl.DisplayNames(['it'], { type: 'region' });
        } catch {
            regionNames = null;
        }
        return countries.map(country => {
            if (regionNames && country.iso_3166_1) {
                try {
                    const localized = regionNames.of(country.iso_3166_1);
                    if (localized) return localized;
                } catch {}
            }
            return country.name || country.iso_3166_1;
        }).filter(Boolean).join(', ');
    }

    function apriLinkEsterno(url) {
        try {
            const popup = window.open(url, '_blank', 'noopener,noreferrer');
            if (popup) {
                popup.opener = null;
                return;
            }
        } catch {}

        try {
            const link = document.createElement('a');
            link.href = url;
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            document.body.appendChild(link);
            link.click();
            link.remove();
        } catch {
            alert('Impossibile aprire il link automaticamente. Copia l\'indirizzo manualmente.');
        }
    }

    async function apriTramaCompleta() {
        if (!elementoSelezionato) return;
        const modal = document.getElementById('overviewModal');
        const titleEl = document.getElementById('overviewModalTitle');
        const metaEl = document.getElementById('overviewModalMeta');
        const textEl = document.getElementById('overviewModalText');
        const castEl = document.getElementById('overviewModalCast');
        const title = currentType === 'movie' ? elementoSelezionato.title : elementoSelezionato.name;
        const text = elementoSelezionato.overview || 'Nessuna trama disponibile.';
        titleEl.textContent = title || 'Trama';
        textEl.textContent = text;
        metaEl.innerHTML = '';
        castEl.innerHTML = '<div class="favorites-empty">Caricamento cast...</div>';
        modal.classList.add('is-open');

        try {
            const [detailsRes, creditsRes] = await Promise.all([
                fetch(`https://api.themoviedb.org/3/${currentType}/${elementoSelezionato.id}?api_key=${API_KEY}&language=it-IT`),
                fetch(`https://api.themoviedb.org/3/${currentType}/${elementoSelezionato.id}/credits?api_key=${API_KEY}&language=it-IT`)
            ]);

            if (detailsRes.ok) {
                const details = await detailsRes.json();
                const runtime = currentType === 'movie' ? formatRuntime(details.runtime) : '';
                const countries = formatCountries(details.production_countries || []);
                const infoItems = [runtime, countries].filter(Boolean);
                metaEl.innerHTML = infoItems.length ? infoItems.map(item => `<span>${item}</span>`).join('') : '<span>Informazioni non disponibili</span>';
            } else {
                metaEl.innerHTML = '<span>Informazioni non disponibili</span>';
            }

            if (creditsRes.ok) {
                const credits = await creditsRes.json();
                const cast = (credits.cast || []).slice(0, 6);
                const director = (credits.crew || []).find(person => person.job === 'Director' || person.department === 'Directing');
                const castMarkup = cast.map(actor => {
                    const photo = actor.profile_path
                        ? `https://image.tmdb.org/t/p/w185${actor.profile_path}`
                        : 'https://via.placeholder.com/185x278?text=No+Photo';
                    return `
                        <div class="overview-modal-actor">
                            <img src="${photo}" alt="${actor.name || ''}">
                            <div class="overview-modal-actor-name">${actor.name || 'Sconosciuto'}</div>
                            <div class="overview-modal-actor-role">${actor.character || 'Cast'}</div>
                        </div>`;
                }).join('');
                castEl.innerHTML = castMarkup || '<div class="favorites-empty">Nessun cast disponibile.</div>';
                if (director) {
                    const directorBlock = document.createElement('div');
                    directorBlock.className = 'overview-modal-actor';
                    directorBlock.innerHTML = `<div class="overview-modal-actor-name">Regista</div><div class="overview-modal-actor-role">${director.name || 'Sconosciuto'}</div>`;
                    castEl.appendChild(directorBlock);
                }
            } else {
                castEl.innerHTML = '<div class="favorites-empty">Nessun cast disponibile.</div>';
            }
        } catch {
            metaEl.innerHTML = '<span>Informazioni non disponibili</span>';
            castEl.innerHTML = '<div class="favorites-empty">Errore nel caricamento dei dettagli.</div>';
        }
    }

    function chiudiTramaModal() {
        document.getElementById('overviewModal').classList.remove('is-open');
    }
</script>
<div id="trailerModal" class="trailer-modal" role="dialog" aria-modal="true" aria-label="Anteprima trailer">
    <button type="button" class="trailer-modal-close" onclick="chiudiTrailerModal()" aria-label="Chiudi">✕</button>
    <iframe id="trailerFrame" class="trailer-modal-frame" width="80%" height="80%" frameborder="0" allowfullscreen></iframe>
</div>

<div id="overviewModal" class="overview-modal" role="dialog" aria-modal="true" aria-label="Trama completa">
    <div class="overview-modal-card">
        <button type="button" class="trailer-modal-close" onclick="chiudiTramaModal()" aria-label="Chiudi">✕</button>
        <div class="overview-modal-title" id="overviewModalTitle">Trama</div>
        <div class="overview-modal-meta" id="overviewModalMeta"></div>
        <div class="overview-modal-text" id="overviewModalText"></div>
        <div class="overview-modal-cast" id="overviewModalCast"></div>
    </div>
</div>

<div id="recModal" class="rec-modal" role="dialog" aria-modal="true" aria-label="Dettaglio titolo">
    <div class="rec-modal-card">
        <button type="button" class="trailer-modal-close" id="recModalCloseBtn" onclick="chiudiPopupConsigliato()" aria-label="Chiudi">✕</button>
        <div class="rec-modal-body">
            <img class="hero-poster" id="heroPoster" src="https://via.placeholder.com/185x278?text=Caricamento..." alt="Poster">
            <div class="hero-details">
                <div class="hero-title" id="heroTitle">Caricamento...</div>
                <div class="hero-meta" id="heroMeta">---</div>
                <div class="hero-overview" id="heroOverview">...</div>
                <button class="btn-action" type="button" onclick="apriTramaCompleta()" style="width: fit-content; margin-top: 4px;">Mostra altro</button>

                <div class="episodes-selector" id="episodesFrame">
                    <label>Stagione:
                        <select id="seasonInput" tabindex="0"></select>
                    </label>
                    <label>Episodio:
                        <select id="episodeInput" tabindex="0"></select>
                    </label>
                </div>

                <div class="hero-actions">
                    <button class="btn-play-large" id="btnPlay" onclick="riproduciInPagina()" tabindex="0" aria-label="Guarda ora">
                        ▶
                    </button>
                    <button class="btn-favorite" id="btnFavorite" type="button" onclick="toggleFavorite(elementoSelezionato)" tabindex="0" aria-label="Aggiungi ai preferiti" aria-pressed="false">♡</button>
                    <button class="btn-action btn-trailer" type="button" onclick="showTrailer()" tabindex="0">Trailer</button>
                </div>
            </div>
        </div>

        <div style="min-width:0; margin-top:20px;">
            <div class="recs-header" id="recsHeader" style="display:none; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px;">
                <div class="section-title" id="recsTitle" style="margin:0;">Potrebbe piacerti anche</div>
                <button class="recs-toggle" id="recsToggleBtn" type="button" onclick="toggleRecs()" aria-expanded="true">Nascondi ▴</button>
            </div>
            <div id="recsGrid" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(90px, 1fr)); gap:8px; width:100%;"></div>
        </div>
    </div>
</div>
</body>
</html>
